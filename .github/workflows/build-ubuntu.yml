name: Build FaceSign Ubuntu

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  ORT_VERSION: '1.26.0'

jobs:
  build-ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true

      - name: Verify native build prerequisites
        run: |
          command -v gcc
          command -v curl
          command -v unzip
          ldconfig -p | grep -q 'libstdc++.so.6'
          ldconfig -p | grep -q 'libgomp.so.1'

      - name: Test, vet and validate frontend scripts
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go test ./...
          go vet ./...
          find internal/web/assets/js -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
          node --test scripts/admin-bulk-attendance-filters.test.cjs scripts/auto-class-seat-board.test.cjs
          for script in scripts/ubuntu/*.sh; do bash -n "$script"; done

      - name: Download official ONNX Runtime CPU package from NuGet
        run: |
          mkdir -p "$RUNNER_TEMP/onnxruntime/nuget" dist
          NUGET_BASE="https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime/${ORT_VERSION}"
          NUGET_PACKAGE="microsoft.ml.onnxruntime.${ORT_VERSION}.nupkg"
          curl -fL --retry 3 --retry-all-errors "$NUGET_BASE/$NUGET_PACKAGE" \
            -o "$RUNNER_TEMP/onnxruntime/$NUGET_PACKAGE"
          unzip -tq "$RUNNER_TEMP/onnxruntime/$NUGET_PACKAGE"
          unzip -p "$RUNNER_TEMP/onnxruntime/$NUGET_PACKAGE" '*.nuspec' > "$RUNNER_TEMP/onnxruntime/package.nuspec"
          grep -q '<id>Microsoft.ML.OnnxRuntime</id>' "$RUNNER_TEMP/onnxruntime/package.nuspec"
          grep -q "<version>${ORT_VERSION}</version>" "$RUNNER_TEMP/onnxruntime/package.nuspec"
          unzip -q "$RUNNER_TEMP/onnxruntime/$NUGET_PACKAGE" 'runtimes/linux-x64/native/*' -d "$RUNNER_TEMP/onnxruntime/nuget"
          ORT_NATIVE="$RUNNER_TEMP/onnxruntime/nuget/runtimes/linux-x64/native"
          test -f "$ORT_NATIVE/libonnxruntime.so"
          find "$ORT_NATIVE" -maxdepth 1 -type f -name '*.so*' -exec cp {} dist/ \;
          cp "$ORT_NATIVE/libonnxruntime.so" "dist/libonnxruntime.so.${ORT_VERSION}"
          test -f "dist/libonnxruntime.so.${ORT_VERSION}"
          LD_LIBRARY_PATH="$GITHUB_WORKSPACE/dist:${LD_LIBRARY_PATH:-}" ldd "dist/libonnxruntime.so.${ORT_VERSION}" | tee "$RUNNER_TEMP/onnxruntime/ldd.txt"
          if grep -q 'not found' "$RUNNER_TEMP/onnxruntime/ldd.txt"; then
            echo "ONNX Runtime has unresolved shared-library dependencies"
            exit 1
          fi

      - name: Build FaceSign Linux AMD64
        run: |
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 CC=gcc \
            go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_SHA}" \
            -o dist/FaceSign ./cmd/facesign
          chmod 755 dist/FaceSign
          dist/FaceSign --help >/dev/null

      - name: Package runtime models and Ubuntu scripts
        run: |
          mkdir -p dist/models/by dist/scripts/ubuntu
          cp models/README.md models/SHA256SUMS models/SILENT_FACE_LICENSE.txt \
            models/YOLOX_LICENSE.txt dist/models/
          cp models/by/README.md dist/models/by/README.md

          # Package only the current default Silent-Face ensemble and YOLOX-Nano.
          curl -fL --retry 3 --retry-all-errors \
            https://github.com/yakhyo/face-anti-spoofing/releases/download/weights/MiniFASNetV2.onnx \
            -o dist/models/MiniFASNetV2.onnx
          curl -fL --retry 3 --retry-all-errors \
            https://github.com/yakhyo/face-anti-spoofing/releases/download/weights/MiniFASNetV1SE.onnx \
            -o dist/models/MiniFASNetV1SE.onnx
          curl -fL --retry 3 --retry-all-errors \
            https://github.com/Megvii-BaseDetection/YOLOX/releases/download/0.1.1rc0/yolox_nano.onnx \
            -o dist/models/yolox_nano.onnx

          (cd dist/models && sha256sum -c SHA256SUMS)

          face_names=(scrfd_10g.onnx arcface_w600k_r50.onnx SHA256SUMS)
          face_count=0
          for name in "${face_names[@]}"; do
            if [[ -f "models/by/$name" ]]; then face_count=$((face_count + 1)); fi
          done
          if [[ "$face_count" -ne 0 && "$face_count" -ne 3 ]]; then
            echo "models/by must contain SCRFD, ArcFace and SHA256SUMS together"
            exit 1
          fi
          if [[ "$face_count" -eq 3 ]]; then
            cp models/by/scrfd_10g.onnx models/by/arcface_w600k_r50.onnx models/by/SHA256SUMS dist/models/by/
            (cd dist/models/by && sha256sum -c SHA256SUMS)
          else
            echo "SCRFD/ArcFace weights not supplied; Ubuntu artifact is not self-contained for identity recognition."
          fi

          cp scripts/ubuntu/*.sh dist/scripts/ubuntu/
          cp README.md dist/README.md
          cp README-UBUNTU.md dist/README-UBUNTU.md
          chmod 755 dist/scripts/ubuntu/start.sh dist/scripts/ubuntu/status.sh dist/scripts/ubuntu/stop.sh
          for script in dist/scripts/ubuntu/*.sh; do bash -n "$script"; done

      - name: Smoke test packaged ONNX models
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/dist
          FACESIGN_TEST_ONNX_DLL: ${{ github.workspace }}/dist/libonnxruntime.so.1.26.0
          FACESIGN_TEST_SILENT_V2_MODEL: ${{ github.workspace }}/dist/models/MiniFASNetV2.onnx
        run: |
          go test -count=1 -v ./internal/liveness -run 'TestSilentFaceModelRuntime'

      - name: Verify Ubuntu package
        run: |
          test -x dist/FaceSign
          test -f dist/libonnxruntime.so.${ORT_VERSION}
          test -f dist/models/by/README.md
          if [[ -f models/by/scrfd_10g.onnx ]]; then
            test -f dist/models/by/scrfd_10g.onnx
            test -f dist/models/by/arcface_w600k_r50.onnx
            test -f dist/models/by/SHA256SUMS
          fi
          test -f dist/scripts/ubuntu/start.sh
          test -f dist/scripts/ubuntu/status.sh
          test -f dist/scripts/ubuntu/stop.sh
          file dist/FaceSign
          ldd dist/FaceSign | tee "$RUNNER_TEMP/facesign-ldd.txt"
          if grep -q 'not found' "$RUNNER_TEMP/facesign-ldd.txt"; then
            echo "FaceSign has unresolved shared-library dependencies"
            exit 1
          fi

      - name: Upload Ubuntu AMD64 package
        uses: actions/upload-artifact@v7
        with:
          name: facesign-ubuntu-amd64-full
          path: dist/
          if-no-files-found: error
          retention-days: 30
