name: Build FaceSign Ubuntu

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  ORT_VERSION: '1.26.0'

jobs:
  build-ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true

      - name: Install native build and runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ca-certificates curl ffmpeg

      - name: Test, vet and validate frontend scripts
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go test ./...
          go vet ./...
          find internal/web/assets/js -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
          for script in scripts/ubuntu/*.sh; do bash -n "$script"; done

      - name: Download ONNX Runtime CPU
        run: |
          mkdir -p "$RUNNER_TEMP/onnxruntime" dist
          curl -fL --retry 3 --retry-all-errors \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz" \
            -o "$RUNNER_TEMP/onnxruntime/onnxruntime.tgz"
          tar -xzf "$RUNNER_TEMP/onnxruntime/onnxruntime.tgz" -C "$RUNNER_TEMP/onnxruntime"
          ORT_ROOT="$RUNNER_TEMP/onnxruntime/onnxruntime-linux-x64-${ORT_VERSION}"
          test -f "$ORT_ROOT/lib/libonnxruntime.so.${ORT_VERSION}"
          find "$ORT_ROOT/lib" -maxdepth 1 -type f -name 'libonnxruntime*.so*' -exec cp {} dist/ \;
          test -f "dist/libonnxruntime.so.${ORT_VERSION}"
          ldd "dist/libonnxruntime.so.${ORT_VERSION}" | tee "$RUNNER_TEMP/onnxruntime/ldd.txt"
          if grep -q 'not found' "$RUNNER_TEMP/onnxruntime/ldd.txt"; then
            echo "ONNX Runtime has unresolved shared-library dependencies"
            exit 1
          fi

      - name: Build FaceSign Linux AMD64
        run: |
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 CC=gcc \
            go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_SHA}" \
            -o dist/FaceSign ./cmd/facesign
          chmod 755 dist/FaceSign
          dist/FaceSign --help >/dev/null

      - name: Package runtime models and Ubuntu scripts
        run: |
          mkdir -p dist/models/by dist/scripts/ubuntu
          cp models/anti-spoof-mn3.onnx models/README.md models/SHA256SUMS \
            models/ANTI_SPOOF_LICENSE.txt models/MINIFAS_LICENSE.txt \
            models/SILENT_FACE_LICENSE.txt models/YOLOX_LICENSE.txt dist/models/
          cp models/by/README.md dist/models/by/README.md

          curl -fL --retry 3 --retry-all-errors \
            https://github.com/yakhyo/face-anti-spoofing/releases/download/weights/MiniFASNetV2.onnx \
            -o dist/models/MiniFASNetV2.onnx
          curl -fL --retry 3 --retry-all-errors \
            https://github.com/yakhyo/face-anti-spoofing/releases/download/weights/MiniFASNetV1SE.onnx \
            -o dist/models/MiniFASNetV1SE.onnx

          mini_model=dist/models/minifasnet-v2se.onnx
          curl -fL --retry 3 --retry-all-errors \
            https://github.com/facenox/face-antispoof-onnx/releases/download/v1.0.0/best_model.onnx \
            -o "$mini_model" || true
          if [[ ! -f "$mini_model" ]] || ! echo "af2381b88f38769222ed93379e12444e2a50814575de1c46170de570c55a42b6  $mini_model" | sha256sum -c --status; then
            rm -f "$mini_model"
            curl -fL --retry 3 --retry-all-errors \
              https://raw.githubusercontent.com/facenox/face-antispoof-onnx/2f8dd93dd0fd9d120f08e83d9020719f67ffdb68/models/best/98.20/best_model.onnx \
              -o "$mini_model"
          fi

          curl -fL --retry 3 --retry-all-errors \
            https://github.com/Megvii-BaseDetection/YOLOX/releases/download/0.1.1rc0/yolox_nano.onnx \
            -o dist/models/yolox_nano.onnx

          (cd dist/models && sha256sum -c SHA256SUMS)

          cp scripts/ubuntu/*.sh dist/scripts/ubuntu/
          cp README.md dist/README.md
          cp README-UBUNTU.md dist/README-UBUNTU.md
          chmod 755 dist/scripts/ubuntu/start.sh dist/scripts/ubuntu/status.sh dist/scripts/ubuntu/stop.sh
          for script in dist/scripts/ubuntu/*.sh; do bash -n "$script"; done

      - name: Smoke test packaged ONNX models
        env:
          FACESIGN_TEST_ONNX_DLL: ${{ github.workspace }}/dist/libonnxruntime.so.1.26.0
          FACESIGN_TEST_SILENT_V2_MODEL: ${{ github.workspace }}/dist/models/MiniFASNetV2.onnx
          FACESIGN_TEST_MINIFAS_MODEL: ${{ github.workspace }}/dist/models/minifasnet-v2se.onnx
        run: |
          go test -count=1 -v ./internal/liveness -run 'TestMiniFASModelRuntime|TestSilentFaceModelRuntime'

      - name: Verify Ubuntu package
        run: |
          test -x dist/FaceSign
          test -f dist/libonnxruntime.so.${ORT_VERSION}
          test -f dist/models/by/README.md
          test -f dist/scripts/ubuntu/start.sh
          test -f dist/scripts/ubuntu/status.sh
          test -f dist/scripts/ubuntu/stop.sh
          file dist/FaceSign
          ldd dist/FaceSign | tee "$RUNNER_TEMP/facesign-ldd.txt"
          if grep -q 'not found' "$RUNNER_TEMP/facesign-ldd.txt"; then
            echo "FaceSign has unresolved shared-library dependencies"
            exit 1
          fi

      - name: Upload Ubuntu AMD64 package
        uses: actions/upload-artifact@v7
        with:
          name: facesign-ubuntu-amd64-full
          path: dist/
          if-no-files-found: error
          retention-days: 30
