name: Build FaceSign Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

env:
  ORT_VERSION: '1.26.0'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true

      - name: Set up MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc

      - name: Test and vet
        shell: pwsh
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build FaceSign
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist, dist\models, dist\scripts | Out-Null
          $gccCommand = Get-Command gcc.exe -ErrorAction SilentlyContinue
          if ($gccCommand) {
            $gcc = $gccCommand.Source
          } else {
            $gccFile = Get-ChildItem -Path $env:RUNNER_TEMP -Filter gcc.exe -File -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '[\\/]mingw64[\\/]bin[\\/]gcc\.exe$' } |
              Select-Object -First 1
            if (-not $gccFile) { throw 'MinGW gcc.exe was not found' }
            $gcc = $gccFile.FullName
          }
          $mingwBin = Split-Path $gcc -Parent
          "MINGW_BIN=$mingwBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $env:CGO_ENABLED = '1'
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          $env:CC = $gcc
          $env:CGO_LDFLAGS = '-static-libgcc'
          go build -trimpath -ldflags '-s -w' -o dist\FaceSign.exe ./cmd/facesign
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Bundle ONNX Runtime and models
        shell: pwsh
        run: |
          $ortZip = Join-Path $env:RUNNER_TEMP 'ort.zip'
          Invoke-WebRequest -Uri "https://github.com/microsoft/onnxruntime/releases/download/v$env:ORT_VERSION/onnxruntime-win-x64-$env:ORT_VERSION.zip" -OutFile $ortZip -UseBasicParsing
          $ortDir = Join-Path $env:RUNNER_TEMP 'ort'
          Expand-Archive -Path $ortZip -DestinationPath $ortDir -Force
          Copy-Item (Join-Path $ortDir "onnxruntime-win-x64-$env:ORT_VERSION\lib\onnxruntime.dll") dist\onnxruntime.dll -Force
          foreach ($dll in @('msvcp140.dll','msvcp140_1.dll','vcruntime140.dll','vcruntime140_1.dll')) {
            $source = Join-Path $env:WINDIR "System32\$dll"
            if (Test-Path $source) { Copy-Item $source (Join-Path 'dist' $dll) -Force }
          }
          $objdump = Join-Path $env:MINGW_BIN 'objdump.exe'
          $dependencyText = & $objdump -p dist\FaceSign.exe
          foreach ($dll in @('libgcc_s_seh-1.dll','libwinpthread-1.dll')) {
            if (($dependencyText -join "`n") -match [regex]::Escape($dll)) {
              Copy-Item (Join-Path $env:MINGW_BIN $dll) (Join-Path 'dist' $dll) -Force
            }
          }
          Invoke-WebRequest -Uri 'https://github.com/opencv/opencv_zoo/raw/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx' -OutFile 'dist\models\face_detection_yunet_2023mar.onnx' -UseBasicParsing
          Invoke-WebRequest -Uri 'https://github.com/opencv/opencv_zoo/raw/main/models/face_recognition_sface/face_recognition_sface_2021dec.onnx' -OutFile 'dist\models\face_recognition_sface_2021dec.onnx' -UseBasicParsing
          Copy-Item scripts\install.ps1 dist\scripts\install.ps1 -Force
          Copy-Item scripts\uninstall.ps1 dist\scripts\uninstall.ps1 -Force
          Copy-Item README.md dist\README.md -Force

      - name: Smoke test recognition
        shell: pwsh
        run: |
          $db = Join-Path $env:RUNNER_TEMP 'facesign.db'
          $originalPath = $env:PATH
          $env:PATH = (Resolve-Path 'dist').Path + ';' + (Join-Path $env:WINDIR 'System32') + ';' + $env:WINDIR
          $process = Start-Process -FilePath (Resolve-Path 'dist\FaceSign.exe') -ArgumentList @('--listen','127.0.0.1:18082','--assets',(Resolve-Path 'dist').Path,'--data',$db,'--detection-threshold','0.60') -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:18082/api/health' -TimeoutSec 3
                if ($health.ok -and $health.device -eq 'cpu' -and -not $health.python -and -not $health.docker) { $ready = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw 'FaceSign health check failed' }
            $home = Invoke-WebRequest -Uri 'http://127.0.0.1:18082/' -UseBasicParsing -TimeoutSec 3
            if ($home.StatusCode -ne 200 -or $home.Content -notmatch '<title>FaceSign</title>') { throw 'FaceSign home page check failed' }
            $appJs = Invoke-WebRequest -Uri 'http://127.0.0.1:18082/app.js' -UseBasicParsing -TimeoutSec 3
            if ($appJs.StatusCode -ne 200 -or $appJs.Content.Length -lt 100) { throw 'FaceSign app.js check failed' }
            $student = Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:18082/api/students' -ContentType 'application/json' -Body '{"student_no":"SMOKE001","name":"Amy","class_name":"Test"}'
            $photo = Join-Path $env:RUNNER_TEMP 'amy.jpg'
            Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/leandroveronezi/go-onnxface/main/examples/fotos/amy.jpg' -OutFile $photo -UseBasicParsing
            $enrollRaw = & curl.exe -fsS -F "file=@$photo" "http://127.0.0.1:18082/api/students/$($student.id)/face"
            if ($LASTEXITCODE -ne 0) { throw 'Enrollment smoke test failed' }
            $recognizeRaw = & curl.exe -fsS -F "file=@$photo" 'http://127.0.0.1:18082/api/recognize'
            if ($LASTEXITCODE -ne 0) { throw 'Recognition smoke test failed' }
            $recognize = $recognizeRaw | ConvertFrom-Json
            if (-not $recognize.recognized -or $recognize.student.student_no -ne 'SMOKE001') { throw 'Recognition did not match enrolled student' }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            $env:PATH = $originalPath
          }

      - name: Upload Windows release
        uses: actions/upload-artifact@v7
        with:
          name: facesign-windows-amd64
          path: dist/
          if-no-files-found: error
          retention-days: 30

  cleanup-old-runs:
    needs: build-windows
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Keep current and previous successful run
        uses: actions/github-script@v9
        env:
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentRun = context.runId;
            const workflowPath = process.env.GITHUB_WORKFLOW_REF.split('@')[0];
            const workflowFile = workflowPath.substring(workflowPath.lastIndexOf('/') + 1);
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: workflowFile, per_page: 100,
            });
            const keep = new Set([currentRun]);
            const previousSuccess = runs
              .filter(run => run.id !== currentRun && run.status === 'completed' && run.conclusion === 'success')
              .sort((a,b) => new Date(b.created_at) - new Date(a.created_at))[0];
            if (previousSuccess) keep.add(previousSuccess.id);
            for (const run of runs) {
              if (run.status !== 'completed' || keep.has(run.id)) continue;
              try {
                await github.rest.actions.deleteWorkflowRun({owner, repo, run_id: run.id});
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
