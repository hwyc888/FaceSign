name: Build FaceSign Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

env:
  ORT_VERSION: '1.26.0'
  FFMPEG_SERIES: '8.1'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true

      - name: Set up MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc

      - name: Test and vet
        shell: pwsh
        run: |
          Get-ChildItem 'internal\web\assets\js' -Filter '*.js' | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build FaceSign
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist, dist\scripts | Out-Null
          $gccCommand = Get-Command gcc.exe -ErrorAction SilentlyContinue
          if ($gccCommand) {
            $gcc = $gccCommand.Source
          } else {
            $gccFile = Get-ChildItem -Path $env:RUNNER_TEMP -Filter gcc.exe -File -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '[\\/]mingw64[\\/]bin[\\/]gcc\.exe$' } |
              Select-Object -First 1
            if (-not $gccFile) { throw 'MinGW gcc.exe was not found' }
            $gcc = $gccFile.FullName
          }
          $mingwBin = Split-Path $gcc -Parent
          "MINGW_BIN=$mingwBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $env:CGO_ENABLED = '1'
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          $env:CC = $gcc
          $env:CGO_LDFLAGS = '-static-libgcc'
          go build -trimpath -ldflags "-s -w -X main.version=$env:GITHUB_SHA" -o dist\FaceSign.exe ./cmd/facesign
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -trimpath -ldflags "-s -w -H=windowsgui -X main.version=$env:GITHUB_SHA" -o dist\FaceSignManager.exe ./cmd/facesign-manager
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path dist-agent, dist-agent\scripts | Out-Null
          go build -trimpath -ldflags "-s -w -X main.version=$env:GITHUB_SHA" -o dist-agent\FaceSignCameraAgent.exe ./cmd/camera-agent
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Bundle native runtime
        shell: pwsh
        run: |
          $ortZip = Join-Path $env:RUNNER_TEMP 'ort.zip'
          Invoke-WebRequest -Uri "https://github.com/microsoft/onnxruntime/releases/download/v$env:ORT_VERSION/onnxruntime-win-x64-$env:ORT_VERSION.zip" -OutFile $ortZip -UseBasicParsing
          $ortDir = Join-Path $env:RUNNER_TEMP 'ort'
          Expand-Archive -Path $ortZip -DestinationPath $ortDir -Force
          Copy-Item (Join-Path $ortDir "onnxruntime-win-x64-$env:ORT_VERSION\lib\onnxruntime.dll") dist\onnxruntime.dll -Force
          foreach ($dll in @('msvcp140.dll','msvcp140_1.dll','vcruntime140.dll','vcruntime140_1.dll')) {
            $source = Join-Path $env:WINDIR "System32\$dll"
            if (Test-Path $source) { Copy-Item $source (Join-Path 'dist' $dll) -Force }
          }
          $objdump = Join-Path $env:MINGW_BIN 'objdump.exe'
          $dependencyText = & $objdump -p dist\FaceSign.exe
          foreach ($dll in @('libgcc_s_seh-1.dll','libwinpthread-1.dll')) {
            if (($dependencyText -join "`n") -match [regex]::Escape($dll)) {
              Copy-Item (Join-Path $env:MINGW_BIN $dll) (Join-Path 'dist' $dll) -Force
            }
          }
          Copy-Item scripts\install.ps1 dist\scripts\install.ps1 -Force
          Copy-Item scripts\uninstall.ps1 dist\scripts\uninstall.ps1 -Force
          Copy-Item scripts\install-client-ca.ps1 dist\scripts\install-client-ca.ps1 -Force
          Copy-Item README.md dist\README.md -Force
          Copy-Item camera-agent.example.json dist-agent\camera-agent.example.json -Force
          Copy-Item CAMERA_AGENT.md dist-agent\README.md -Force
          Copy-Item scripts\install-camera-agent.ps1 dist-agent\scripts\install-camera-agent.ps1 -Force
          Copy-Item scripts\uninstall-camera-agent.ps1 dist-agent\scripts\uninstall-camera-agent.ps1 -Force
          & dist-agent\FaceSignCameraAgent.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Bundle FFmpeg RTSP runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $release = Invoke-RestMethod -Headers $headers -Uri 'https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/latest'
          $seriesPattern = [regex]::Escape($env:FFMPEG_SERIES)
          $asset = $release.assets |
            Where-Object {
              $_.name -match "(?i)^ffmpeg-n$seriesPattern(?:\.\d+)*(?:-latest)?-win64-lgpl-$seriesPattern\.zip$" -and
              $_.name -notmatch '(?i)-shared-'
            } |
            Select-Object -First 1
          if (-not $asset) {
            $available = ($release.assets | Where-Object { $_.name -match '(?i)win64.*lgpl' } | Select-Object -ExpandProperty name) -join ', '
            throw "Compatible FFmpeg $env:FFMPEG_SERIES win64 LGPL static asset not found. Available: $available"
          }
          if ($asset.digest -notmatch '^sha256:([0-9a-fA-F]{64})$') { throw "FFmpeg asset does not expose a SHA-256 digest: $($asset.digest)" }
          $expectedHash = $matches[1].ToUpperInvariant()

          $ffmpegZip = Join-Path $env:RUNNER_TEMP 'facesign-ffmpeg.zip'
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $ffmpegZip -UseBasicParsing
          $actualHash = (Get-FileHash $ffmpegZip -Algorithm SHA256).Hash
          if ($actualHash -ne $expectedHash) {
            throw "FFmpeg archive checksum mismatch: expected $expectedHash got $actualHash"
          }

          $ffmpegDir = Join-Path $env:RUNNER_TEMP 'facesign-ffmpeg'
          Remove-Item $ffmpegDir -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path $ffmpegZip -DestinationPath $ffmpegDir -Force
          $ffmpegExe = Get-ChildItem -Path $ffmpegDir -Filter 'ffmpeg.exe' -File -Recurse | Select-Object -First 1
          if (-not $ffmpegExe) { throw 'FFmpeg archive did not contain ffmpeg.exe' }
          Copy-Item $ffmpegExe.FullName 'dist\ffmpeg.exe' -Force

          New-Item -ItemType Directory -Force -Path 'dist\licenses' | Out-Null
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/FFmpeg/FFmpeg/n8.1/COPYING.LGPLv2.1' -OutFile 'dist\licenses\FFMPEG_LGPLv2.1.txt' -UseBasicParsing
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/FFmpeg/FFmpeg/n8.1/COPYING.LGPLv3' -OutFile 'dist\licenses\FFMPEG_LGPLv3.txt' -UseBasicParsing
          @"
          FaceSign bundles an FFmpeg 8.1 LGPL Windows runtime for RTSP H.264/H.265 decoding.
          Build source: https://github.com/BtbN/FFmpeg-Builds
          Asset: $($asset.name)
          Asset SHA-256: $expectedHash
          FFmpeg source/license information: https://ffmpeg.org/
          "@ | Set-Content -Path 'dist\licenses\FFMPEG_NOTICE.txt' -Encoding UTF8

          & 'dist\ffmpeg.exe' -hide_banner -version
          if ($LASTEXITCODE -ne 0) { throw 'Bundled ffmpeg.exe could not start' }

      - name: Create full and lightweight packages
        shell: pwsh
        run: |
          Remove-Item 'dist-full','dist-lite' -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item 'dist' 'dist-full' -Recurse
          Copy-Item 'dist' 'dist-lite' -Recurse

          New-Item -ItemType Directory -Force -Path 'dist-full\models' | Out-Null
          foreach ($file in @(
            'face_detection_yunet_2023mar.onnx',
            'face_recognition_sface_2021dec.onnx',
            'anti-spoof-mn3.onnx',
            'ANTI_SPOOF_LICENSE.txt',
            'YOLOX_LICENSE.txt',
            'SHA256SUMS',
            'README.md'
          )) {
            Copy-Item (Join-Path 'models' $file) (Join-Path 'dist-full\models' $file) -Force
          }

          $personModel = 'dist-full\models\yolox_nano.onnx'
          Invoke-WebRequest -Uri 'https://github.com/Megvii-BaseDetection/YOLOX/releases/download/0.1.1rc0/yolox_nano.onnx' -OutFile $personModel -UseBasicParsing
          $personHash = (Get-FileHash $personModel -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($personHash -ne 'c789161ed43c8269fcd4e67c67eeeb4e80c622da2eb296a20bc6007bd18a0b7d') {
            throw "YOLOX-Nano checksum mismatch: $personHash"
          }


          Copy-Item 'dist-full' 'dist-full-no-ffmpeg' -Recurse
          Remove-Item 'dist-full-no-ffmpeg\ffmpeg.exe' -Force
          Remove-Item 'dist-full-no-ffmpeg\licenses\FFMPEG_LGPLv2.1.txt' -Force -ErrorAction SilentlyContinue
          Remove-Item 'dist-full-no-ffmpeg\licenses\FFMPEG_LGPLv3.txt' -Force -ErrorAction SilentlyContinue
          Remove-Item 'dist-full-no-ffmpeg\licenses\FFMPEG_NOTICE.txt' -Force -ErrorAction SilentlyContinue

          Remove-Item 'dist-no-models-ffmpeg-zip' -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item 'dist-lite' 'dist-no-models-ffmpeg-zip' -Recurse
          Remove-Item 'dist-no-models-ffmpeg-zip\ffmpeg.exe' -Force
          $ffmpegArchive = Join-Path $env:RUNNER_TEMP 'facesign-ffmpeg.zip'
          if (-not (Test-Path $ffmpegArchive -PathType Leaf)) { throw 'Verified FFmpeg archive is missing from runner temp' }
          Copy-Item $ffmpegArchive 'dist-no-models-ffmpeg-zip\ffmpeg-8.1-win64-lgpl.zip' -Force

      - name: Verify release variants
        shell: pwsh
        run: |
          if (Test-Path 'dist-lite\models') { throw 'Lightweight package must not contain a models directory' }
          if (Test-Path 'dist-no-models-ffmpeg-zip\models') { throw 'No-models FFmpeg-ZIP package must not contain a models directory' }
          if (-not (Test-Path 'dist-full\models' -PathType Container)) { throw 'Full package is missing the models directory' }
          if (-not (Test-Path 'dist-full-no-ffmpeg\models' -PathType Container)) { throw 'Full no-FFmpeg package is missing the models directory' }

          $onnxFiles = @(Get-ChildItem -Path 'dist-full\models' -Filter '*.onnx' -File)
          if ($onnxFiles.Count -ne 4) { throw "Full package must contain exactly 4 ONNX model files, got $($onnxFiles.Count)" }

          $checksums = Get-Content 'models\SHA256SUMS'
          foreach ($line in $checksums) {
            if ($line -notmatch '^([0-9a-f]{64})\s+(.+)$') { throw "Invalid model checksum line: $line" }
            $expected = $matches[1].ToUpperInvariant()
            $packagedPath = Join-Path 'dist-full\models' $matches[2]
            $packagedActual = (Get-FileHash $packagedPath -Algorithm SHA256).Hash
            if ($packagedActual -ne $expected) { throw "Packaged model checksum mismatch: $packagedPath" }
          }

          $fullExe = (Get-FileHash 'dist-full\FaceSign.exe' -Algorithm SHA256).Hash
          $liteExe = (Get-FileHash 'dist-lite\FaceSign.exe' -Algorithm SHA256).Hash
          if ($fullExe -ne $liteExe) { throw 'Full and lightweight packages must contain the same FaceSign.exe' }
          if (-not (Test-Path 'dist-full\FaceSignManager.exe' -PathType Leaf)) { throw 'Full package is missing FaceSignManager.exe' }
          if (-not (Test-Path 'dist-lite\FaceSignManager.exe' -PathType Leaf)) { throw 'Lightweight package is missing FaceSignManager.exe' }
          $fullManager = (Get-FileHash 'dist-full\FaceSignManager.exe' -Algorithm SHA256).Hash
          $liteManager = (Get-FileHash 'dist-lite\FaceSignManager.exe' -Algorithm SHA256).Hash
          if ($fullManager -ne $liteManager) { throw 'Full and lightweight packages must contain the same FaceSignManager.exe' }

          $noFFmpegExe = (Get-FileHash 'dist-full-no-ffmpeg\FaceSign.exe' -Algorithm SHA256).Hash
          $noFFmpegManager = (Get-FileHash 'dist-full-no-ffmpeg\FaceSignManager.exe' -Algorithm SHA256).Hash
          if ($fullExe -ne $noFFmpegExe) { throw 'Full and no-FFmpeg packages must contain the same FaceSign.exe' }
          if ($fullManager -ne $noFFmpegManager) { throw 'Full and no-FFmpeg packages must contain the same FaceSignManager.exe' }
          if (Test-Path 'dist-full-no-ffmpeg\ffmpeg.exe' -PathType Leaf) { throw 'No-FFmpeg package must not contain ffmpeg.exe' }
          if (Test-Path 'dist-full-no-ffmpeg\licenses\FFMPEG_NOTICE.txt' -PathType Leaf) { throw 'No-FFmpeg package must not contain FFmpeg notices' }
          $noFFmpegModels = @(Get-ChildItem -Path 'dist-full-no-ffmpeg\models' -Filter '*.onnx' -File)
          if ($noFFmpegModels.Count -ne 4) { throw "Full no-FFmpeg package must contain exactly 4 ONNX model files, got $($noFFmpegModels.Count)" }

          $zipVariantExe = (Get-FileHash 'dist-no-models-ffmpeg-zip\FaceSign.exe' -Algorithm SHA256).Hash
          $zipVariantManager = (Get-FileHash 'dist-no-models-ffmpeg-zip\FaceSignManager.exe' -Algorithm SHA256).Hash
          if ($liteExe -ne $zipVariantExe) { throw 'No-models FFmpeg-ZIP package must contain the same FaceSign.exe as lite' }
          if ($liteManager -ne $zipVariantManager) { throw 'No-models FFmpeg-ZIP package must contain the same FaceSignManager.exe as lite' }
          if (Test-Path 'dist-no-models-ffmpeg-zip\ffmpeg.exe' -PathType Leaf) { throw 'No-models FFmpeg-ZIP package must not contain an extracted ffmpeg.exe' }
          $packagedFFmpegZip = 'dist-no-models-ffmpeg-zip\ffmpeg-8.1-win64-lgpl.zip'
          if (-not (Test-Path $packagedFFmpegZip -PathType Leaf)) { throw 'No-models FFmpeg-ZIP package is missing the compressed FFmpeg archive' }
          $sourceFFmpegZip = Join-Path $env:RUNNER_TEMP 'facesign-ffmpeg.zip'
          if ((Get-FileHash $packagedFFmpegZip -Algorithm SHA256).Hash -ne (Get-FileHash $sourceFFmpegZip -Algorithm SHA256).Hash) {
            throw 'Packaged compressed FFmpeg archive checksum changed'
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $packagedFFmpegZip))
          try {
            $ffmpegEntry = $zip.Entries | Where-Object { $_.FullName -match '(?i)(^|/)ffmpeg\.exe            $ffmpeg = Join-Path $variant 'ffmpeg.exe'
            if (-not (Test-Path $ffmpeg -PathType Leaf)) { throw "$variant is missing ffmpeg.exe for RTSP decoding" }
            if (-not (Test-Path (Join-Path $variant 'licenses\FFMPEG_NOTICE.txt') -PathType Leaf)) { throw "$variant is missing FFmpeg notices" }
            & $ffmpeg -hide_banner -version | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "$variant ffmpeg.exe failed to start" }
          }
          $fullFFmpeg = (Get-FileHash 'dist-full\ffmpeg.exe' -Algorithm SHA256).Hash
          $liteFFmpeg = (Get-FileHash 'dist-lite\ffmpeg.exe' -Algorithm SHA256).Hash
          if ($fullFFmpeg -ne $liteFFmpeg) { throw 'Full and lightweight packages must contain the same ffmpeg.exe' }

      - name: Smoke test recognition
        shell: pwsh
        run: |
          $db = Join-Path $env:RUNNER_TEMP 'facesign.db'
          $smokeAssets = (Resolve-Path 'dist-full').Path
          $originalPath = $env:PATH
          $originalModelDir = $env:FACESIGN_MODEL_DIR
          Remove-Item Env:FACESIGN_MODEL_DIR -ErrorAction SilentlyContinue
          $env:PATH = $smokeAssets + ';' + (Join-Path $env:WINDIR 'System32') + ';' + $env:WINDIR
          $tlsDir = Join-Path $env:RUNNER_TEMP 'facesign-tls-full'
          $process = Start-Process -FilePath (Resolve-Path 'dist-full\FaceSign.exe') -ArgumentList @('--listen','127.0.0.1:18082','--https-listen','127.0.0.1:18084','--http-redirect=false','--tls-dir',$tlsDir,'--tls-hosts','smoke.facesign.test','--open-browser=false','--assets',$smokeAssets,'--data',$db,'--detection-threshold','0.60') -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:18082/api/health' -TimeoutSec 3
                if ($health.ok -and $health.device -eq 'cpu' -and -not $health.python -and -not $health.docker -and $health.liveness -match 'anti-spoof' -and $health.person_tracking -match 'YOLOX') { $ready = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw 'FaceSign health check failed' }
            if (-not (Test-Path (Join-Path $tlsDir 'facesign-root-ca.crt') -PathType Leaf)) { throw 'Persistent root CA was not generated' }
            if (-not (Test-Path (Join-Path $tlsDir 'facesign-server.crt') -PathType Leaf)) { throw 'HTTPS server certificate was not generated' }
            $httpsVersionRaw = & curl.exe -k -fsS 'https://127.0.0.1:18084/api/version'
            if ($LASTEXITCODE -ne 0) { throw 'FaceSign HTTPS endpoint failed' }
            $httpsVersion = $httpsVersionRaw | ConvertFrom-Json
            if ($httpsVersion.version -ne $env:GITHUB_SHA) { throw "Unexpected HTTPS FaceSign version: $($httpsVersion.version)" }
            if (-not (Test-Path 'dist-full\scripts\install-client-ca.ps1' -PathType Leaf)) { throw 'Client CA installer is missing from full package' }
            if (-not (Test-Path (Join-Path $smokeAssets 'models') -PathType Container)) { throw 'Full release smoke test is missing bundled models' }
            if (-not (Test-Path (Join-Path $smokeAssets 'ffmpeg.exe') -PathType Leaf)) { throw 'Full release smoke test is missing ffmpeg.exe' }
            $ffmpegSmoke = Join-Path $env:RUNNER_TEMP 'ffmpeg-smoke.mjpg'
            & (Join-Path $smokeAssets 'ffmpeg.exe') -hide_banner -loglevel error -f lavfi -i 'testsrc=size=160x90:rate=5' -frames:v 2 -c:v mjpeg -f image2pipe -y $ffmpegSmoke
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path $ffmpegSmoke -PathType Leaf) -or (Get-Item $ffmpegSmoke).Length -le 100) { throw 'Bundled FFmpeg MJPEG output smoke test failed' }
            $versionInfo = Invoke-RestMethod -Uri 'http://127.0.0.1:18082/api/version' -TimeoutSec 3
            if ($versionInfo.version -ne $env:GITHUB_SHA) { throw "Unexpected FaceSign version: $($versionInfo.version)" }
            $homeHeaders = Join-Path $env:RUNNER_TEMP 'home.headers'
            $homeBody = Join-Path $env:RUNNER_TEMP 'home.html'
            $homeStatus = & curl.exe -sS --max-redirs 0 -D $homeHeaders -o $homeBody -w "%{http_code}" 'http://127.0.0.1:18082/'
            if ($LASTEXITCODE -ne 0 -or $homeStatus -ne '200') { throw "FaceSign home page returned HTTP $homeStatus" }
            $homeHeaderText = Get-Content $homeHeaders -Raw
            if ($homeHeaderText -match '(?im)^Location:') { throw 'FaceSign home page unexpectedly redirects' }
            $homeContent = Get-Content $homeBody -Raw
            if ($homeContent -notmatch '<title>FaceSign</title>') { throw 'FaceSign home page content check failed' }
            $coreJs = Invoke-WebRequest -Uri 'http://127.0.0.1:18082/js/core.js' -UseBasicParsing -TimeoutSec 3
            $enrollmentJs = Invoke-WebRequest -Uri 'http://127.0.0.1:18082/js/enrollment.js' -UseBasicParsing -TimeoutSec 3
            $classesJs = Invoke-WebRequest -Uri 'http://127.0.0.1:18082/js/classes.js' -UseBasicParsing -TimeoutSec 3
            $photoImportJs = Invoke-WebRequest -Uri 'http://127.0.0.1:18082/js/photo_import.js' -UseBasicParsing -TimeoutSec 3
            $seatingJs = Invoke-WebRequest -Uri 'http://127.0.0.1:18082/js/seating.js' -UseBasicParsing -TimeoutSec 3
            $seatEditorJs = Invoke-WebRequest -Uri 'http://127.0.0.1:18082/js/seat_editor.js' -UseBasicParsing -TimeoutSec 3
            if ($coreJs.StatusCode -ne 200 -or $enrollmentJs.Content -notmatch 'captureEnrollment' -or $classesJs.Content -notmatch 'loadClasses' -or $photoImportJs.Content -notmatch 'photoImportSessionID' -or $seatingJs.Content -notmatch 'loadCheckinSeatBoard' -or $seatEditorJs.Content -notmatch 'openClassSeatEditor') { throw 'FaceSign frontend module check failed' }

            $classOne = Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:18082/api/classes' -ContentType 'application/json' -Body '{"name":"Test","seat_rows":2,"seats_per_row":3,"late_after":"08:05","deadline":"23:59"}'
            $classTwo = Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:18082/api/classes' -ContentType 'application/json' -Body '{"name":"Backup","seat_rows":2,"seats_per_row":3}'
            Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:18082/api/classes/$($classTwo.id)/move" -ContentType 'application/json' -Body '{"direction":"up"}' | Out-Null
            $classes = Invoke-RestMethod -Uri 'http://127.0.0.1:18082/api/classes' -TimeoutSec 3
            if ($classes.Count -ne 2 -or $classes[0].name -ne 'Backup' -or $classes[1].name -ne 'Test') { throw 'Class ordering smoke test failed' }

            $photo = Join-Path $env:RUNNER_TEMP 'amy.jpg'
            Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/leandroveronezi/go-onnxface/main/examples/fotos/amy.jpg' -OutFile $photo -UseBasicParsing

            $checkRaw = & curl.exe -fsS -F "file=@$photo" 'http://127.0.0.1:18082/api/enrollment/check'
            if ($LASTEXITCODE -ne 0) { throw 'Enrollment duplicate pre-check failed' }
            $check = $checkRaw | ConvertFrom-Json
            if ($check.duplicate) { throw 'Fresh face was incorrectly reported as duplicate' }

            $createRaw = & curl.exe -fsS -F "file=@$photo" -F "student_no=SMOKE001" -F "name=Amy" -F "class_name=Test" -F "label=正面" 'http://127.0.0.1:18082/api/enrollment/create'
            if ($LASTEXITCODE -ne 0) { throw 'Face-first enrollment creation failed' }
            $create = $createRaw | ConvertFrom-Json
            $student = $create.student
            if ($student.student_no -ne 'SMOKE001' -or $student.face_count -ne 1 -or $student.class_name -ne 'Test') { throw 'Face-first enrollment returned unexpected student data' }
            $deleteUsedClassStatus = & curl.exe -sS -o NUL -w "%{http_code}" -X DELETE "http://127.0.0.1:18082/api/classes/$($classOne.id)"
            if ($deleteUsedClassStatus -ne '400') { throw "Used class deletion should be blocked with 400, got $deleteUsedClassStatus" }
            $renameClass = Invoke-RestMethod -Method Put -Uri "http://127.0.0.1:18082/api/classes/$($classOne.id)" -ContentType 'application/json' -Body '{"name":"Test-Renamed"}'
            if ($renameClass.name -ne 'Test-Renamed' -or $renameClass.student_count -ne 1) { throw 'Class rename smoke test failed' }
            $studentAfterRename = (Invoke-RestMethod -Uri 'http://127.0.0.1:18082/api/students' -TimeoutSec 3 | Where-Object { $_.student_no -eq 'SMOKE001' } | Select-Object -First 1)
            if (-not $studentAfterRename -or $studentAfterRename.class_name -ne 'Test-Renamed') { throw 'Class rename did not update student record' }

            $duplicateRaw = & curl.exe -fsS -F "file=@$photo" 'http://127.0.0.1:18082/api/enrollment/check'
            if ($LASTEXITCODE -ne 0) { throw 'Duplicate enrollment re-check failed' }
            $duplicate = $duplicateRaw | ConvertFrom-Json
            if (-not $duplicate.duplicate -or $duplicate.student.student_no -ne 'SMOKE001') { throw 'Duplicate face was not linked to the existing student' }

            $samples = Invoke-RestMethod -Uri "http://127.0.0.1:18082/api/students/$($student.id)/faces" -TimeoutSec 3
            if ($samples.Count -ne 1 -or $samples[0].label -ne '正面') { throw 'Initial face sample was not queryable' }

            $importPhoto = Join-Path $env:RUNNER_TEMP 'penny.jpg'
            Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/leandroveronezi/go-onnxface/main/examples/fotos/penny.jpg' -OutFile $importPhoto -UseBasicParsing
            $importDir = Join-Path $env:RUNNER_TEMP 'photo-import'
            New-Item -ItemType Directory -Force -Path $importDir | Out-Null
            Copy-Item $photo (Join-Path $importDir 'SMOKE001_Amy.jpg') -Force
            Copy-Item $importPhoto (Join-Path $importDir 'SMOKE002_Penny.jpg') -Force
            Set-Content -Path (Join-Path $importDir 'notes.txt') -Value 'ignored non-image'
            $importZip = Join-Path $env:RUNNER_TEMP 'photo-import.zip'
            Compress-Archive -Path (Join-Path $importDir '*') -DestinationPath $importZip -Force

            $analysisRaw = & curl.exe -fsS -F "file=@$importZip" 'http://127.0.0.1:18082/api/photo-import/analyze'
            if ($LASTEXITCODE -ne 0) { throw 'Photo ZIP analysis failed' }
            $analysis = $analysisRaw | ConvertFrom-Json
            if (-not $analysis.session_id -or $analysis.items.Count -ne 2) { throw 'Unexpected photo import analysis result' }
            $amyImport = $analysis.items | Where-Object { $_.student_no -eq 'SMOKE001' } | Select-Object -First 1
            $bernadetteImport = $analysis.items | Where-Object { $_.student_no -eq 'SMOKE002' } | Select-Object -First 1
            if (-not $amyImport -or $amyImport.status -ne 'existing') { throw 'Existing face was not detected during ZIP import' }
            if (-not $bernadetteImport -or $bernadetteImport.status -ne 'ready') { throw "New photo was not ready for import: $($bernadetteImport.status) $($bernadetteImport.reason)" }

            $commitBody = @{
              items = @(
                @{ id = $amyImport.id; action = 'skip'; student_no = 'SMOKE001'; name = 'Amy'; class_name = 'Test-Renamed' },
                @{ id = $bernadetteImport.id; action = 'new'; student_no = 'SMOKE002'; name = 'Penny'; class_name = 'Test-Renamed' }
              )
            } | ConvertTo-Json -Depth 6
            $commitResult = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:18082/api/photo-import/$($analysis.session_id)/commit" -ContentType 'application/json' -Body $commitBody
            if ($commitResult.imported -ne 1 -or $commitResult.failed -ne 0) { throw 'Photo ZIP commit failed' }

            $studentsAfterImport = Invoke-RestMethod -Uri 'http://127.0.0.1:18082/api/students' -TimeoutSec 3
            $importedStudent = $studentsAfterImport | Where-Object { $_.student_no -eq 'SMOKE002' } | Select-Object -First 1
            if (-not $importedStudent -or $importedStudent.face_count -ne 1 -or $importedStudent.class_name -ne 'Test-Renamed') { throw 'Imported student data is incorrect' }

            Invoke-RestMethod -Method Put -Uri "http://127.0.0.1:18082/api/students/$($importedStudent.id)" -ContentType 'application/json' -Body '{"class_name":"Backup"}' | Out-Null
            $studentsAfterEdit = Invoke-RestMethod -Uri 'http://127.0.0.1:18082/api/students' -TimeoutSec 3
            $editedStudent = $studentsAfterEdit | Where-Object { $_.student_no -eq 'SMOKE002' } | Select-Object -First 1
            if (-not $editedStudent -or $editedStudent.class_name -ne 'Backup') { throw 'Imported student class edit failed' }

            $importRecognizeRaw = & curl.exe -fsS -H 'X-FaceSign-Session: smoke-import' -F "file=@$importPhoto" 'http://127.0.0.1:18082/api/recognize'
            if ($LASTEXITCODE -ne 0) { throw 'Imported photo recognition failed' }
            $importRecognize = $importRecognizeRaw | ConvertFrom-Json
            if (-not $importRecognize.matched -or $importRecognize.student.student_no -ne 'SMOKE002') { throw 'Imported face sample identity did not match correctly' }
            if ($importRecognize.recognized) { throw 'Single recognition frame must not bypass multi-frame liveness voting' }
            if (-not $importRecognize.liveness_status) { throw 'Passive liveness status was not returned' }
            Write-Host "Passive liveness score (import smoke): $($importRecognize.liveness_score) status=$($importRecognize.liveness_status)"

            $sameSampleStatus = & curl.exe -sS -o NUL -w "%{http_code}" -F "file=@$photo" -F "label=左侧" "http://127.0.0.1:18082/api/students/$($student.id)/faces"
            if ($sameSampleStatus -ne '409') { throw "Near-identical supplemental sample should be rejected with 409, got $sameSampleStatus" }

            $recognizeRaw = & curl.exe -fsS -H 'X-FaceSign-Session: smoke-amy' -F "file=@$photo" 'http://127.0.0.1:18082/api/recognize'
            if ($LASTEXITCODE -ne 0) { throw 'Recognition smoke test failed' }
            $recognize = $recognizeRaw | ConvertFrom-Json
            if (-not $recognize.matched -or $recognize.student.student_no -ne 'SMOKE001') { throw 'Recognition identity did not match enrolled student' }
            if ($recognize.recognized) { throw 'One frame unexpectedly created an attendance decision' }
            if ($recognize.liveness_frames -ne 1) { throw "Expected first liveness frame, got $($recognize.liveness_frames)" }

            Invoke-RestMethod -Method Put -Uri "http://127.0.0.1:18082/api/students/$($student.id)" -ContentType 'application/json' -Body '{"seat_no":1}' | Out-Null
            $absentStudent = Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:18082/api/students' -ContentType 'application/json' -Body '{"student_no":"SMOKE003","name":"Absent","class_name":"Test-Renamed"}'
            Invoke-RestMethod -Method Put -Uri "http://127.0.0.1:18082/api/students/$($absentStudent.id)" -ContentType 'application/json' -Body '{"seat_no":2}' | Out-Null
            $today = Get-Date -Format 'yyyy-MM-dd'
            $seatBoard = Invoke-RestMethod -Uri "http://127.0.0.1:18082/api/attendance/seats?day=$today&class_name=Test-Renamed" -TimeoutSec 3
            if ($seatBoard.total -ne 2 -or $seatBoard.signed -ne 0 -or $seatBoard.unsigned -ne 2) { throw 'Single-frame recognition must not mark attendance before liveness vote' }
            if ($seatBoard.class.seat_rows -ne 2 -or $seatBoard.class.seats_per_row -ne 3 -or $seatBoard.class.late_after -ne '08:05' -or $seatBoard.class.deadline -ne '23:59') { throw 'Seat layout/rule smoke test failed' }

            $swap = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:18082/api/classes/$($classOne.id)/seats" -ContentType 'application/json' -Body (@{ student_id = $student.id; target_seat_no = 2 } | ConvertTo-Json)
            if ($swap.swapped_student_id -ne $absentStudent.id) { throw 'Visual seat swap API did not swap occupied seats' }
            $studentsAfterSwap = Invoke-RestMethod -Uri 'http://127.0.0.1:18082/api/students' -TimeoutSec 3
            $amyAfterSwap = $studentsAfterSwap | Where-Object { $_.student_no -eq 'SMOKE001' } | Select-Object -First 1
            $absentAfterSwap = $studentsAfterSwap | Where-Object { $_.student_no -eq 'SMOKE003' } | Select-Object -First 1
            if ($amyAfterSwap.seat_no -ne 2 -or $absentAfterSwap.seat_no -ne 1) { throw 'Seat swap persistence smoke test failed' }

            $settings = Invoke-RestMethod -Method Put -Uri "http://127.0.0.1:18082/api/classes/$($classOne.id)/settings" -ContentType 'application/json' -Body '{"name":"Test-Renamed","seat_rows":2,"seats_per_row":3,"late_after":"08:06","deadline":"23:58"}'
            if ($settings.late_after -ne '08:06' -or $settings.deadline -ne '23:58') { throw 'Editable class attendance times smoke test failed' }

            $unknownPhoto = Join-Path $env:RUNNER_TEMP 'howard.jpg'
            Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/leandroveronezi/go-onnxface/main/examples/fotos/howard.jpg' -OutFile $unknownPhoto -UseBasicParsing
            $groupPhoto = Join-Path $env:RUNNER_TEMP 'group.jpg'
            Add-Type -AssemblyName System.Drawing
            $knownImage = [System.Drawing.Image]::FromFile($photo)
            $unknownImage = [System.Drawing.Image]::FromFile($unknownPhoto)
            $groupBitmap = New-Object System.Drawing.Bitmap 900,450
            $graphics = [System.Drawing.Graphics]::FromImage($groupBitmap)
            try {
              $graphics.Clear([System.Drawing.Color]::White)
              $graphics.DrawImage($knownImage, 0, 0, 450, 450)
              $graphics.DrawImage($unknownImage, 450, 0, 450, 450)
              $groupBitmap.Save($groupPhoto, [System.Drawing.Imaging.ImageFormat]::Jpeg)
            } finally {
              $graphics.Dispose()
              $groupBitmap.Dispose()
              $knownImage.Dispose()
              $unknownImage.Dispose()
            }

            $groupEnrollStatus = & curl.exe -sS -o NUL -w "%{http_code}" -F "file=@$groupPhoto" "http://127.0.0.1:18082/api/students/$($student.id)/face"
            if ($groupEnrollStatus -ne '422') { throw "Multi-face enrollment should be rejected with 422, got $groupEnrollStatus" }

            $groupRecognizeRaw = & curl.exe -fsS -H 'X-FaceSign-Session: smoke-group' -F "file=@$groupPhoto" 'http://127.0.0.1:18082/api/recognize'
            if ($LASTEXITCODE -ne 0) { throw 'Multi-face recognition smoke test failed' }
            $groupRecognize = $groupRecognizeRaw | ConvertFrom-Json
            if ($groupRecognize.detected_count -lt 2) { throw "Expected at least 2 detected faces, got $($groupRecognize.detected_count)" }
            if ($groupRecognize.matched_count -lt 1) { throw 'Expected at least one enrolled identity match in group recognition' }
            if ($groupRecognize.unregistered_count -lt 1) { throw 'Expected at least one unregistered face in group recognition' }
            $knownResult = $groupRecognize.faces | Where-Object { $_.matched -and $_.student.student_no -eq 'SMOKE001' } | Select-Object -First 1
            if (-not $knownResult -or -not $knownResult.liveness_status) { throw 'Enrolled student was not tracked with liveness in group recognition' }
            $unknownResult = $groupRecognize.faces | Where-Object { -not $_.matched -and $_.status -eq '未录入' } | Select-Object -First 1
            if (-not $unknownResult) { throw 'Unregistered face was not reported as 未录入' }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            $env:PATH = $originalPath
            $env:FACESIGN_MODEL_DIR = $originalModelDir
          }

      - name: Smoke test lightweight package with reusable models
        shell: pwsh
        run: |
          $db = Join-Path $env:RUNNER_TEMP 'facesign-lite.db'
          $liteAssets = (Resolve-Path 'dist-lite').Path
          $modelCache = (Resolve-Path 'models').Path
          $originalPath = $env:PATH
          $originalModelDir = $env:FACESIGN_MODEL_DIR
          $env:FACESIGN_MODEL_DIR = $modelCache
          $env:PATH = $liteAssets + ';' + (Join-Path $env:WINDIR 'System32') + ';' + $env:WINDIR
          $liteTLSDir = Join-Path $env:RUNNER_TEMP 'facesign-tls-lite'
          $process = Start-Process -FilePath (Resolve-Path 'dist-lite\FaceSign.exe') -ArgumentList @('--listen','127.0.0.1:18083','--https-listen','127.0.0.1:18085','--http-redirect=false','--tls-dir',$liteTLSDir,'--open-browser=false','--assets',$liteAssets,'--data',$db,'--detection-threshold','0.60') -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:18083/api/health' -TimeoutSec 3
                if ($health.ok -and $health.device -eq 'cpu' -and $health.liveness -match 'anti-spoof') { $ready = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw 'Lightweight package could not start with an existing model cache' }
            $liteHTTPSRaw = & curl.exe -k -fsS 'https://127.0.0.1:18085/api/version'
            if ($LASTEXITCODE -ne 0) { throw 'Lightweight package HTTPS endpoint failed' }
            if (($liteHTTPSRaw | ConvertFrom-Json).version -ne $env:GITHUB_SHA) { throw 'Lightweight package HTTPS version check failed' }
            if (Test-Path (Join-Path $liteAssets 'models')) { throw 'Lightweight package unexpectedly gained bundled models' }
            $versionInfo = Invoke-RestMethod -Uri 'http://127.0.0.1:18083/api/version' -TimeoutSec 3
            if ($versionInfo.version -ne $env:GITHUB_SHA) { throw "Unexpected lightweight package version: $($versionInfo.version)" }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            $env:PATH = $originalPath
            if ($null -eq $originalModelDir) {
              Remove-Item Env:FACESIGN_MODEL_DIR -ErrorAction SilentlyContinue
            } else {
              $env:FACESIGN_MODEL_DIR = $originalModelDir
            }
          }


      - name: Smoke test full package without bundled FFmpeg
        shell: pwsh
        run: |
          $db = Join-Path $env:RUNNER_TEMP 'facesign-no-ffmpeg.db'
          $assets = (Resolve-Path 'dist-full-no-ffmpeg').Path
          $originalPath = $env:PATH
          $originalModelDir = $env:FACESIGN_MODEL_DIR
          Remove-Item Env:FACESIGN_MODEL_DIR -ErrorAction SilentlyContinue
          $env:PATH = $assets + ';' + (Join-Path $env:WINDIR 'System32') + ';' + $env:WINDIR
          $tlsDir = Join-Path $env:RUNNER_TEMP 'facesign-tls-no-ffmpeg'
          $process = Start-Process -FilePath (Resolve-Path 'dist-full-no-ffmpeg\FaceSign.exe') -ArgumentList @('--listen','127.0.0.1:18088','--https-listen','127.0.0.1:18089','--http-redirect=false','--tls-dir',$tlsDir,'--open-browser=false','--assets',$assets,'--data',$db) -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:18088/api/health' -TimeoutSec 3
                if ($health.ok -and $health.device -eq 'cpu') { $ready = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw 'Full no-FFmpeg package could not start without bundled FFmpeg' }
            if (Test-Path (Join-Path $assets 'ffmpeg.exe') -PathType Leaf) { throw 'No-FFmpeg smoke package unexpectedly contains ffmpeg.exe' }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            $env:PATH = $originalPath
            if ($null -eq $originalModelDir) {
              Remove-Item Env:FACESIGN_MODEL_DIR -ErrorAction SilentlyContinue
            } else {
              $env:FACESIGN_MODEL_DIR = $originalModelDir
            }
          }

      - name: Verify portable startup survives HTTPS port conflict
        shell: pwsh
        run: |
          $liteAssets = (Resolve-Path 'dist-lite').Path
          $modelCache = (Resolve-Path 'models').Path
          $db = Join-Path $env:RUNNER_TEMP 'facesign-portable.db'
          $tlsDir = Join-Path $env:RUNNER_TEMP 'facesign-portable-tls'
          $originalPath = $env:PATH
          $originalModelDir = $env:FACESIGN_MODEL_DIR
          $env:FACESIGN_MODEL_DIR = $modelCache
          $env:PATH = $liteAssets + ';' + (Join-Path $env:WINDIR 'System32') + ';' + $env:WINDIR
          $blocker = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 18086)
          $blocker.Start()
          $process = $null
          try {
            $process = Start-Process -FilePath (Resolve-Path 'dist-lite\FaceSign.exe') -ArgumentList @('--listen','127.0.0.1:18087','--https-listen','127.0.0.1:18086','--http-redirect=false','--tls-dir',$tlsDir,'--open-browser=false','--assets',$liteAssets,'--data',$db) -PassThru -WindowStyle Hidden
            $ready = $false
            for ($i = 0; $i -lt 20; $i++) {
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:18087/api/health' -TimeoutSec 2
                if ($health.ok) { $ready = $true; break }
              } catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $ready) { throw 'Portable FaceSign stopped when HTTPS port was occupied' }
            $startupLog = Join-Path (Split-Path $db -Parent) 'facesign-startup.log'
            if (-not (Test-Path $startupLog)) { throw 'Portable startup log was not written' }
            if ((Get-Content $startupLog -Raw) -notmatch 'https_listen=disabled') { throw 'Portable HTTPS fallback was not recorded' }
          } finally {
            if ($process) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
            $blocker.Stop()
            $env:PATH = $originalPath
            if ($null -eq $originalModelDir) {
              Remove-Item Env:FACESIGN_MODEL_DIR -ErrorAction SilentlyContinue
            } else {
              $env:FACESIGN_MODEL_DIR = $originalModelDir
            }
          }

      - name: Upload Windows Camera Agent
        uses: actions/upload-artifact@v7
        with:
          name: facesign-camera-agent-windows-amd64
          path: dist-agent/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows full release
        uses: actions/upload-artifact@v7
        with:
          name: facesign-windows-amd64-full
          path: dist-full/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows lightweight release
        uses: actions/upload-artifact@v7
        with:
          name: facesign-windows-amd64-lite
          path: dist-lite/
          if-no-files-found: error
          retention-days: 30


      - name: Upload Windows full release without FFmpeg
        uses: actions/upload-artifact@v7
        with:
          name: facesign-windows-amd64-full-no-ffmpeg
          path: dist-full-no-ffmpeg/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows release without models and with compressed FFmpeg
        uses: actions/upload-artifact@v7
        with:
          name: facesign-windows-amd64-no-models-ffmpeg-zip
          path: dist-no-models-ffmpeg-zip/
          if-no-files-found: error
          retention-days: 30

  cleanup-old-runs:
    needs: build-windows
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Keep current and previous successful run
        uses: actions/github-script@v9
        env:
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentRun = context.runId;
            const workflowPath = process.env.GITHUB_WORKFLOW_REF.split('@')[0];
            const workflowFile = workflowPath.substring(workflowPath.lastIndexOf('/') + 1);
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: workflowFile, per_page: 100,
            });
            const keep = new Set([currentRun]);
            const previousSuccess = runs
              .filter(run => run.id !== currentRun && run.status === 'completed' && run.conclusion === 'success')
              .sort((a,b) => new Date(b.created_at) - new Date(a.created_at))[0];
            if (previousSuccess) keep.add(previousSuccess.id);
            for (const run of runs) {
              if (run.status !== 'completed' || keep.has(run.id)) continue;
              try {
                await github.rest.actions.deleteWorkflowRun({owner, repo, run_id: run.id});
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
 } | Select-Object -First 1
            if (-not $ffmpegEntry) { throw 'Compressed FFmpeg archive does not contain ffmpeg.exe' }
          } finally {
            $zip.Dispose()
          }

          foreach ($variant in @('dist-full','dist-lite')) {
            $ffmpeg = Join-Path $variant 'ffmpeg.exe'
            if (-not (Test-Path $ffmpeg -PathType Leaf)) { throw "$variant is missing ffmpeg.exe for RTSP decoding" }
            if (-not (Test-Path (Join-Path $variant 'licenses\FFMPEG_NOTICE.txt') -PathType Leaf)) { throw "$variant is missing FFmpeg notices" }
            & $ffmpeg -hide_banner -version | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "$variant ffmpeg.exe failed to start" }
          }
          $fullFFmpeg = (Get-FileHash 'dist-full\ffmpeg.exe' -Algorithm SHA256).Hash
          $liteFFmpeg = (Get-FileHash 'dist-lite\ffmpeg.exe' -Algorithm SHA256).Hash
          if ($fullFFmpeg -ne $liteFFmpeg) { throw 'Full and lightweight packages must contain the same ffmpeg.exe' }

      - name: Smoke test recognition
        shell: pwsh
        run: |
          $db = Join-Path $env:RUNNER_TEMP 'facesign.db'
          $smokeAssets = (Resolve-Path 'dist-full').Path
          $originalPath = $env:PATH
          $originalModelDir = $env:FACESIGN_MODEL_DIR
          Remove-Item Env:FACESIGN_MODEL_DIR -ErrorAction SilentlyContinue
          $env:PATH = $smokeAssets + ';' + (Join-Path $env:WINDIR 'System32') + ';' + $env:WINDIR
          $tlsDir = Join-Path $env:RUNNER_TEMP 'facesign-tls-full'
          $process = Start-Process -FilePath (Resolve-Path 'dist-full\FaceSign.exe') -ArgumentList @('--listen','127.0.0.1:18082','--https-listen','127.0.0.1:18084','--http-redirect=false','--tls-dir',$tlsDir,'--tls-hosts','smoke.facesign.test','--open-browser=false','--assets',$smokeAssets,'--data',$db,'--detection-threshold','0.60') -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:18082/api/health' -TimeoutSec 3
                if ($health.ok -and $health.device -eq 'cpu' -and -not $health.python -and -not $health.docker -and $health.liveness -match 'anti-spoof' -and $health.person_tracking -match 'YOLOX') { $ready = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw 'FaceSign health check failed' }
            if (-not (Test-Path (Join-Path $tlsDir 'facesign-root-ca.crt') -PathType Leaf)) { throw 'Persistent root CA was not generated' }
            if (-not (Test-Path (Join-Path $tlsDir 'facesign-server.crt') -PathType Leaf)) { throw 'HTTPS server certificate was not generated' }
            $httpsVersionRaw = & curl.exe -k -fsS 'https://127.0.0.1:18084/api/version'
            if ($LASTEXITCODE -ne 0) { throw 'FaceSign HTTPS endpoint failed' }
            $httpsVersion = $httpsVersionRaw | ConvertFrom-Json
            if ($httpsVersion.version -ne $env:GITHUB_SHA) { throw "Unexpected HTTPS FaceSign version: $($httpsVersion.version)" }
            if (-not (Test-Path 'dist-full\scripts\install-client-ca.ps1' -PathType Leaf)) { throw 'Client CA installer is missing from full package' }
            if (-not (Test-Path (Join-Path $smokeAssets 'models') -PathType Container)) { throw 'Full release smoke test is missing bundled models' }
            if (-not (Test-Path (Join-Path $smokeAssets 'ffmpeg.exe') -PathType Leaf)) { throw 'Full release smoke test is missing ffmpeg.exe' }
            $ffmpegSmoke = Join-Path $env:RUNNER_TEMP 'ffmpeg-smoke.mjpg'
            & (Join-Path $smokeAssets 'ffmpeg.exe') -hide_banner -loglevel error -f lavfi -i 'testsrc=size=160x90:rate=5' -frames:v 2 -c:v mjpeg -f image2pipe -y $ffmpegSmoke
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path $ffmpegSmoke -PathType Leaf) -or (Get-Item $ffmpegSmoke).Length -le 100) { throw 'Bundled FFmpeg MJPEG output smoke test failed' }
            $versionInfo = Invoke-RestMethod -Uri 'http://127.0.0.1:18082/api/version' -TimeoutSec 3
            if ($versionInfo.version -ne $env:GITHUB_SHA) { throw "Unexpected FaceSign version: $($versionInfo.version)" }
            $homeHeaders = Join-Path $env:RUNNER_TEMP 'home.headers'
            $homeBody = Join-Path $env:RUNNER_TEMP 'home.html'
            $homeStatus = & curl.exe -sS --max-redirs 0 -D $homeHeaders -o $homeBody -w "%{http_code}" 'http://127.0.0.1:18082/'
            if ($LASTEXITCODE -ne 0 -or $homeStatus -ne '200') { throw "FaceSign home page returned HTTP $homeStatus" }
            $homeHeaderText = Get-Content $homeHeaders -Raw
            if ($homeHeaderText -match '(?im)^Location:') { throw 'FaceSign home page unexpectedly redirects' }
            $homeContent = Get-Content $homeBody -Raw
            if ($homeContent -notmatch '<title>FaceSign</title>') { throw 'FaceSign home page content check failed' }
            $coreJs = Invoke-WebRequest -Uri 'http://127.0.0.1:18082/js/core.js' -UseBasicParsing -TimeoutSec 3
            $enrollmentJs = Invoke-WebRequest -Uri 'http://127.0.0.1:18082/js/enrollment.js' -UseBasicParsing -TimeoutSec 3
            $classesJs = Invoke-WebRequest -Uri 'http://127.0.0.1:18082/js/classes.js' -UseBasicParsing -TimeoutSec 3
            $photoImportJs = Invoke-WebRequest -Uri 'http://127.0.0.1:18082/js/photo_import.js' -UseBasicParsing -TimeoutSec 3
            $seatingJs = Invoke-WebRequest -Uri 'http://127.0.0.1:18082/js/seating.js' -UseBasicParsing -TimeoutSec 3
            $seatEditorJs = Invoke-WebRequest -Uri 'http://127.0.0.1:18082/js/seat_editor.js' -UseBasicParsing -TimeoutSec 3
            if ($coreJs.StatusCode -ne 200 -or $enrollmentJs.Content -notmatch 'captureEnrollment' -or $classesJs.Content -notmatch 'loadClasses' -or $photoImportJs.Content -notmatch 'photoImportSessionID' -or $seatingJs.Content -notmatch 'loadCheckinSeatBoard' -or $seatEditorJs.Content -notmatch 'openClassSeatEditor') { throw 'FaceSign frontend module check failed' }

            $classOne = Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:18082/api/classes' -ContentType 'application/json' -Body '{"name":"Test","seat_rows":2,"seats_per_row":3,"late_after":"08:05","deadline":"23:59"}'
            $classTwo = Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:18082/api/classes' -ContentType 'application/json' -Body '{"name":"Backup","seat_rows":2,"seats_per_row":3}'
            Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:18082/api/classes/$($classTwo.id)/move" -ContentType 'application/json' -Body '{"direction":"up"}' | Out-Null
            $classes = Invoke-RestMethod -Uri 'http://127.0.0.1:18082/api/classes' -TimeoutSec 3
            if ($classes.Count -ne 2 -or $classes[0].name -ne 'Backup' -or $classes[1].name -ne 'Test') { throw 'Class ordering smoke test failed' }

            $photo = Join-Path $env:RUNNER_TEMP 'amy.jpg'
            Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/leandroveronezi/go-onnxface/main/examples/fotos/amy.jpg' -OutFile $photo -UseBasicParsing

            $checkRaw = & curl.exe -fsS -F "file=@$photo" 'http://127.0.0.1:18082/api/enrollment/check'
            if ($LASTEXITCODE -ne 0) { throw 'Enrollment duplicate pre-check failed' }
            $check = $checkRaw | ConvertFrom-Json
            if ($check.duplicate) { throw 'Fresh face was incorrectly reported as duplicate' }

            $createRaw = & curl.exe -fsS -F "file=@$photo" -F "student_no=SMOKE001" -F "name=Amy" -F "class_name=Test" -F "label=正面" 'http://127.0.0.1:18082/api/enrollment/create'
            if ($LASTEXITCODE -ne 0) { throw 'Face-first enrollment creation failed' }
            $create = $createRaw | ConvertFrom-Json
            $student = $create.student
            if ($student.student_no -ne 'SMOKE001' -or $student.face_count -ne 1 -or $student.class_name -ne 'Test') { throw 'Face-first enrollment returned unexpected student data' }
            $deleteUsedClassStatus = & curl.exe -sS -o NUL -w "%{http_code}" -X DELETE "http://127.0.0.1:18082/api/classes/$($classOne.id)"
            if ($deleteUsedClassStatus -ne '400') { throw "Used class deletion should be blocked with 400, got $deleteUsedClassStatus" }
            $renameClass = Invoke-RestMethod -Method Put -Uri "http://127.0.0.1:18082/api/classes/$($classOne.id)" -ContentType 'application/json' -Body '{"name":"Test-Renamed"}'
            if ($renameClass.name -ne 'Test-Renamed' -or $renameClass.student_count -ne 1) { throw 'Class rename smoke test failed' }
            $studentAfterRename = (Invoke-RestMethod -Uri 'http://127.0.0.1:18082/api/students' -TimeoutSec 3 | Where-Object { $_.student_no -eq 'SMOKE001' } | Select-Object -First 1)
            if (-not $studentAfterRename -or $studentAfterRename.class_name -ne 'Test-Renamed') { throw 'Class rename did not update student record' }

            $duplicateRaw = & curl.exe -fsS -F "file=@$photo" 'http://127.0.0.1:18082/api/enrollment/check'
            if ($LASTEXITCODE -ne 0) { throw 'Duplicate enrollment re-check failed' }
            $duplicate = $duplicateRaw | ConvertFrom-Json
            if (-not $duplicate.duplicate -or $duplicate.student.student_no -ne 'SMOKE001') { throw 'Duplicate face was not linked to the existing student' }

            $samples = Invoke-RestMethod -Uri "http://127.0.0.1:18082/api/students/$($student.id)/faces" -TimeoutSec 3
            if ($samples.Count -ne 1 -or $samples[0].label -ne '正面') { throw 'Initial face sample was not queryable' }

            $importPhoto = Join-Path $env:RUNNER_TEMP 'penny.jpg'
            Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/leandroveronezi/go-onnxface/main/examples/fotos/penny.jpg' -OutFile $importPhoto -UseBasicParsing
            $importDir = Join-Path $env:RUNNER_TEMP 'photo-import'
            New-Item -ItemType Directory -Force -Path $importDir | Out-Null
            Copy-Item $photo (Join-Path $importDir 'SMOKE001_Amy.jpg') -Force
            Copy-Item $importPhoto (Join-Path $importDir 'SMOKE002_Penny.jpg') -Force
            Set-Content -Path (Join-Path $importDir 'notes.txt') -Value 'ignored non-image'
            $importZip = Join-Path $env:RUNNER_TEMP 'photo-import.zip'
            Compress-Archive -Path (Join-Path $importDir '*') -DestinationPath $importZip -Force

            $analysisRaw = & curl.exe -fsS -F "file=@$importZip" 'http://127.0.0.1:18082/api/photo-import/analyze'
            if ($LASTEXITCODE -ne 0) { throw 'Photo ZIP analysis failed' }
            $analysis = $analysisRaw | ConvertFrom-Json
            if (-not $analysis.session_id -or $analysis.items.Count -ne 2) { throw 'Unexpected photo import analysis result' }
            $amyImport = $analysis.items | Where-Object { $_.student_no -eq 'SMOKE001' } | Select-Object -First 1
            $bernadetteImport = $analysis.items | Where-Object { $_.student_no -eq 'SMOKE002' } | Select-Object -First 1
            if (-not $amyImport -or $amyImport.status -ne 'existing') { throw 'Existing face was not detected during ZIP import' }
            if (-not $bernadetteImport -or $bernadetteImport.status -ne 'ready') { throw "New photo was not ready for import: $($bernadetteImport.status) $($bernadetteImport.reason)" }

            $commitBody = @{
              items = @(
                @{ id = $amyImport.id; action = 'skip'; student_no = 'SMOKE001'; name = 'Amy'; class_name = 'Test-Renamed' },
                @{ id = $bernadetteImport.id; action = 'new'; student_no = 'SMOKE002'; name = 'Penny'; class_name = 'Test-Renamed' }
              )
            } | ConvertTo-Json -Depth 6
            $commitResult = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:18082/api/photo-import/$($analysis.session_id)/commit" -ContentType 'application/json' -Body $commitBody
            if ($commitResult.imported -ne 1 -or $commitResult.failed -ne 0) { throw 'Photo ZIP commit failed' }

            $studentsAfterImport = Invoke-RestMethod -Uri 'http://127.0.0.1:18082/api/students' -TimeoutSec 3
            $importedStudent = $studentsAfterImport | Where-Object { $_.student_no -eq 'SMOKE002' } | Select-Object -First 1
            if (-not $importedStudent -or $importedStudent.face_count -ne 1 -or $importedStudent.class_name -ne 'Test-Renamed') { throw 'Imported student data is incorrect' }

            Invoke-RestMethod -Method Put -Uri "http://127.0.0.1:18082/api/students/$($importedStudent.id)" -ContentType 'application/json' -Body '{"class_name":"Backup"}' | Out-Null
            $studentsAfterEdit = Invoke-RestMethod -Uri 'http://127.0.0.1:18082/api/students' -TimeoutSec 3
            $editedStudent = $studentsAfterEdit | Where-Object { $_.student_no -eq 'SMOKE002' } | Select-Object -First 1
            if (-not $editedStudent -or $editedStudent.class_name -ne 'Backup') { throw 'Imported student class edit failed' }

            $importRecognizeRaw = & curl.exe -fsS -H 'X-FaceSign-Session: smoke-import' -F "file=@$importPhoto" 'http://127.0.0.1:18082/api/recognize'
            if ($LASTEXITCODE -ne 0) { throw 'Imported photo recognition failed' }
            $importRecognize = $importRecognizeRaw | ConvertFrom-Json
            if (-not $importRecognize.matched -or $importRecognize.student.student_no -ne 'SMOKE002') { throw 'Imported face sample identity did not match correctly' }
            if ($importRecognize.recognized) { throw 'Single recognition frame must not bypass multi-frame liveness voting' }
            if (-not $importRecognize.liveness_status) { throw 'Passive liveness status was not returned' }
            Write-Host "Passive liveness score (import smoke): $($importRecognize.liveness_score) status=$($importRecognize.liveness_status)"

            $sameSampleStatus = & curl.exe -sS -o NUL -w "%{http_code}" -F "file=@$photo" -F "label=左侧" "http://127.0.0.1:18082/api/students/$($student.id)/faces"
            if ($sameSampleStatus -ne '409') { throw "Near-identical supplemental sample should be rejected with 409, got $sameSampleStatus" }

            $recognizeRaw = & curl.exe -fsS -H 'X-FaceSign-Session: smoke-amy' -F "file=@$photo" 'http://127.0.0.1:18082/api/recognize'
            if ($LASTEXITCODE -ne 0) { throw 'Recognition smoke test failed' }
            $recognize = $recognizeRaw | ConvertFrom-Json
            if (-not $recognize.matched -or $recognize.student.student_no -ne 'SMOKE001') { throw 'Recognition identity did not match enrolled student' }
            if ($recognize.recognized) { throw 'One frame unexpectedly created an attendance decision' }
            if ($recognize.liveness_frames -ne 1) { throw "Expected first liveness frame, got $($recognize.liveness_frames)" }

            Invoke-RestMethod -Method Put -Uri "http://127.0.0.1:18082/api/students/$($student.id)" -ContentType 'application/json' -Body '{"seat_no":1}' | Out-Null
            $absentStudent = Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:18082/api/students' -ContentType 'application/json' -Body '{"student_no":"SMOKE003","name":"Absent","class_name":"Test-Renamed"}'
            Invoke-RestMethod -Method Put -Uri "http://127.0.0.1:18082/api/students/$($absentStudent.id)" -ContentType 'application/json' -Body '{"seat_no":2}' | Out-Null
            $today = Get-Date -Format 'yyyy-MM-dd'
            $seatBoard = Invoke-RestMethod -Uri "http://127.0.0.1:18082/api/attendance/seats?day=$today&class_name=Test-Renamed" -TimeoutSec 3
            if ($seatBoard.total -ne 2 -or $seatBoard.signed -ne 0 -or $seatBoard.unsigned -ne 2) { throw 'Single-frame recognition must not mark attendance before liveness vote' }
            if ($seatBoard.class.seat_rows -ne 2 -or $seatBoard.class.seats_per_row -ne 3 -or $seatBoard.class.late_after -ne '08:05' -or $seatBoard.class.deadline -ne '23:59') { throw 'Seat layout/rule smoke test failed' }

            $swap = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:18082/api/classes/$($classOne.id)/seats" -ContentType 'application/json' -Body (@{ student_id = $student.id; target_seat_no = 2 } | ConvertTo-Json)
            if ($swap.swapped_student_id -ne $absentStudent.id) { throw 'Visual seat swap API did not swap occupied seats' }
            $studentsAfterSwap = Invoke-RestMethod -Uri 'http://127.0.0.1:18082/api/students' -TimeoutSec 3
            $amyAfterSwap = $studentsAfterSwap | Where-Object { $_.student_no -eq 'SMOKE001' } | Select-Object -First 1
            $absentAfterSwap = $studentsAfterSwap | Where-Object { $_.student_no -eq 'SMOKE003' } | Select-Object -First 1
            if ($amyAfterSwap.seat_no -ne 2 -or $absentAfterSwap.seat_no -ne 1) { throw 'Seat swap persistence smoke test failed' }

            $settings = Invoke-RestMethod -Method Put -Uri "http://127.0.0.1:18082/api/classes/$($classOne.id)/settings" -ContentType 'application/json' -Body '{"name":"Test-Renamed","seat_rows":2,"seats_per_row":3,"late_after":"08:06","deadline":"23:58"}'
            if ($settings.late_after -ne '08:06' -or $settings.deadline -ne '23:58') { throw 'Editable class attendance times smoke test failed' }

            $unknownPhoto = Join-Path $env:RUNNER_TEMP 'howard.jpg'
            Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/leandroveronezi/go-onnxface/main/examples/fotos/howard.jpg' -OutFile $unknownPhoto -UseBasicParsing
            $groupPhoto = Join-Path $env:RUNNER_TEMP 'group.jpg'
            Add-Type -AssemblyName System.Drawing
            $knownImage = [System.Drawing.Image]::FromFile($photo)
            $unknownImage = [System.Drawing.Image]::FromFile($unknownPhoto)
            $groupBitmap = New-Object System.Drawing.Bitmap 900,450
            $graphics = [System.Drawing.Graphics]::FromImage($groupBitmap)
            try {
              $graphics.Clear([System.Drawing.Color]::White)
              $graphics.DrawImage($knownImage, 0, 0, 450, 450)
              $graphics.DrawImage($unknownImage, 450, 0, 450, 450)
              $groupBitmap.Save($groupPhoto, [System.Drawing.Imaging.ImageFormat]::Jpeg)
            } finally {
              $graphics.Dispose()
              $groupBitmap.Dispose()
              $knownImage.Dispose()
              $unknownImage.Dispose()
            }

            $groupEnrollStatus = & curl.exe -sS -o NUL -w "%{http_code}" -F "file=@$groupPhoto" "http://127.0.0.1:18082/api/students/$($student.id)/face"
            if ($groupEnrollStatus -ne '422') { throw "Multi-face enrollment should be rejected with 422, got $groupEnrollStatus" }

            $groupRecognizeRaw = & curl.exe -fsS -H 'X-FaceSign-Session: smoke-group' -F "file=@$groupPhoto" 'http://127.0.0.1:18082/api/recognize'
            if ($LASTEXITCODE -ne 0) { throw 'Multi-face recognition smoke test failed' }
            $groupRecognize = $groupRecognizeRaw | ConvertFrom-Json
            if ($groupRecognize.detected_count -lt 2) { throw "Expected at least 2 detected faces, got $($groupRecognize.detected_count)" }
            if ($groupRecognize.matched_count -lt 1) { throw 'Expected at least one enrolled identity match in group recognition' }
            if ($groupRecognize.unregistered_count -lt 1) { throw 'Expected at least one unregistered face in group recognition' }
            $knownResult = $groupRecognize.faces | Where-Object { $_.matched -and $_.student.student_no -eq 'SMOKE001' } | Select-Object -First 1
            if (-not $knownResult -or -not $knownResult.liveness_status) { throw 'Enrolled student was not tracked with liveness in group recognition' }
            $unknownResult = $groupRecognize.faces | Where-Object { -not $_.matched -and $_.status -eq '未录入' } | Select-Object -First 1
            if (-not $unknownResult) { throw 'Unregistered face was not reported as 未录入' }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            $env:PATH = $originalPath
            $env:FACESIGN_MODEL_DIR = $originalModelDir
          }

      - name: Smoke test lightweight package with reusable models
        shell: pwsh
        run: |
          $db = Join-Path $env:RUNNER_TEMP 'facesign-lite.db'
          $liteAssets = (Resolve-Path 'dist-lite').Path
          $modelCache = (Resolve-Path 'models').Path
          $originalPath = $env:PATH
          $originalModelDir = $env:FACESIGN_MODEL_DIR
          $env:FACESIGN_MODEL_DIR = $modelCache
          $env:PATH = $liteAssets + ';' + (Join-Path $env:WINDIR 'System32') + ';' + $env:WINDIR
          $liteTLSDir = Join-Path $env:RUNNER_TEMP 'facesign-tls-lite'
          $process = Start-Process -FilePath (Resolve-Path 'dist-lite\FaceSign.exe') -ArgumentList @('--listen','127.0.0.1:18083','--https-listen','127.0.0.1:18085','--http-redirect=false','--tls-dir',$liteTLSDir,'--open-browser=false','--assets',$liteAssets,'--data',$db,'--detection-threshold','0.60') -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:18083/api/health' -TimeoutSec 3
                if ($health.ok -and $health.device -eq 'cpu' -and $health.liveness -match 'anti-spoof') { $ready = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw 'Lightweight package could not start with an existing model cache' }
            $liteHTTPSRaw = & curl.exe -k -fsS 'https://127.0.0.1:18085/api/version'
            if ($LASTEXITCODE -ne 0) { throw 'Lightweight package HTTPS endpoint failed' }
            if (($liteHTTPSRaw | ConvertFrom-Json).version -ne $env:GITHUB_SHA) { throw 'Lightweight package HTTPS version check failed' }
            if (Test-Path (Join-Path $liteAssets 'models')) { throw 'Lightweight package unexpectedly gained bundled models' }
            $versionInfo = Invoke-RestMethod -Uri 'http://127.0.0.1:18083/api/version' -TimeoutSec 3
            if ($versionInfo.version -ne $env:GITHUB_SHA) { throw "Unexpected lightweight package version: $($versionInfo.version)" }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            $env:PATH = $originalPath
            if ($null -eq $originalModelDir) {
              Remove-Item Env:FACESIGN_MODEL_DIR -ErrorAction SilentlyContinue
            } else {
              $env:FACESIGN_MODEL_DIR = $originalModelDir
            }
          }


      - name: Smoke test full package without bundled FFmpeg
        shell: pwsh
        run: |
          $db = Join-Path $env:RUNNER_TEMP 'facesign-no-ffmpeg.db'
          $assets = (Resolve-Path 'dist-full-no-ffmpeg').Path
          $originalPath = $env:PATH
          $originalModelDir = $env:FACESIGN_MODEL_DIR
          Remove-Item Env:FACESIGN_MODEL_DIR -ErrorAction SilentlyContinue
          $env:PATH = $assets + ';' + (Join-Path $env:WINDIR 'System32') + ';' + $env:WINDIR
          $tlsDir = Join-Path $env:RUNNER_TEMP 'facesign-tls-no-ffmpeg'
          $process = Start-Process -FilePath (Resolve-Path 'dist-full-no-ffmpeg\FaceSign.exe') -ArgumentList @('--listen','127.0.0.1:18088','--https-listen','127.0.0.1:18089','--http-redirect=false','--tls-dir',$tlsDir,'--open-browser=false','--assets',$assets,'--data',$db) -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:18088/api/health' -TimeoutSec 3
                if ($health.ok -and $health.device -eq 'cpu') { $ready = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw 'Full no-FFmpeg package could not start without bundled FFmpeg' }
            if (Test-Path (Join-Path $assets 'ffmpeg.exe') -PathType Leaf) { throw 'No-FFmpeg smoke package unexpectedly contains ffmpeg.exe' }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            $env:PATH = $originalPath
            if ($null -eq $originalModelDir) {
              Remove-Item Env:FACESIGN_MODEL_DIR -ErrorAction SilentlyContinue
            } else {
              $env:FACESIGN_MODEL_DIR = $originalModelDir
            }
          }

      - name: Verify portable startup survives HTTPS port conflict
        shell: pwsh
        run: |
          $liteAssets = (Resolve-Path 'dist-lite').Path
          $modelCache = (Resolve-Path 'models').Path
          $db = Join-Path $env:RUNNER_TEMP 'facesign-portable.db'
          $tlsDir = Join-Path $env:RUNNER_TEMP 'facesign-portable-tls'
          $originalPath = $env:PATH
          $originalModelDir = $env:FACESIGN_MODEL_DIR
          $env:FACESIGN_MODEL_DIR = $modelCache
          $env:PATH = $liteAssets + ';' + (Join-Path $env:WINDIR 'System32') + ';' + $env:WINDIR
          $blocker = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 18086)
          $blocker.Start()
          $process = $null
          try {
            $process = Start-Process -FilePath (Resolve-Path 'dist-lite\FaceSign.exe') -ArgumentList @('--listen','127.0.0.1:18087','--https-listen','127.0.0.1:18086','--http-redirect=false','--tls-dir',$tlsDir,'--open-browser=false','--assets',$liteAssets,'--data',$db) -PassThru -WindowStyle Hidden
            $ready = $false
            for ($i = 0; $i -lt 20; $i++) {
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:18087/api/health' -TimeoutSec 2
                if ($health.ok) { $ready = $true; break }
              } catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $ready) { throw 'Portable FaceSign stopped when HTTPS port was occupied' }
            $startupLog = Join-Path (Split-Path $db -Parent) 'facesign-startup.log'
            if (-not (Test-Path $startupLog)) { throw 'Portable startup log was not written' }
            if ((Get-Content $startupLog -Raw) -notmatch 'https_listen=disabled') { throw 'Portable HTTPS fallback was not recorded' }
          } finally {
            if ($process) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
            $blocker.Stop()
            $env:PATH = $originalPath
            if ($null -eq $originalModelDir) {
              Remove-Item Env:FACESIGN_MODEL_DIR -ErrorAction SilentlyContinue
            } else {
              $env:FACESIGN_MODEL_DIR = $originalModelDir
            }
          }

      - name: Upload Windows Camera Agent
        uses: actions/upload-artifact@v7
        with:
          name: facesign-camera-agent-windows-amd64
          path: dist-agent/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows full release
        uses: actions/upload-artifact@v7
        with:
          name: facesign-windows-amd64-full
          path: dist-full/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows lightweight release
        uses: actions/upload-artifact@v7
        with:
          name: facesign-windows-amd64-lite
          path: dist-lite/
          if-no-files-found: error
          retention-days: 30


      - name: Upload Windows full release without FFmpeg
        uses: actions/upload-artifact@v7
        with:
          name: facesign-windows-amd64-full-no-ffmpeg
          path: dist-full-no-ffmpeg/
          if-no-files-found: error
          retention-days: 30

  cleanup-old-runs:
    needs: build-windows
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Keep current and previous successful run
        uses: actions/github-script@v9
        env:
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentRun = context.runId;
            const workflowPath = process.env.GITHUB_WORKFLOW_REF.split('@')[0];
            const workflowFile = workflowPath.substring(workflowPath.lastIndexOf('/') + 1);
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: workflowFile, per_page: 100,
            });
            const keep = new Set([currentRun]);
            const previousSuccess = runs
              .filter(run => run.id !== currentRun && run.status === 'completed' && run.conclusion === 'success')
              .sort((a,b) => new Date(b.created_at) - new Date(a.created_at))[0];
            if (previousSuccess) keep.add(previousSuccess.id);
            for (const run of runs) {
              if (run.status !== 'completed' || keep.has(run.id)) continue;
              try {
                await github.rest.actions.deleteWorkflowRun({owner, repo, run_id: run.id});
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
