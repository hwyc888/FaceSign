name: Build FaceSign Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

env:
  ORT_VERSION: '1.26.0'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true

      - name: Set up MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc

      - name: Test and vet
        shell: pwsh
        run: |
          Get-ChildItem 'internal\web\assets\js' -Filter '*.js' | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build FaceSign
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist, dist\scripts | Out-Null
          $gccCommand = Get-Command gcc.exe -ErrorAction SilentlyContinue
          if ($gccCommand) {
            $gcc = $gccCommand.Source
          } else {
            $gccFile = Get-ChildItem -Path $env:RUNNER_TEMP -Filter gcc.exe -File -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '[\\/]mingw64[\\/]bin[\\/]gcc\.exe$' } |
              Select-Object -First 1
            if (-not $gccFile) { throw 'MinGW gcc.exe was not found' }
            $gcc = $gccFile.FullName
          }
          $mingwBin = Split-Path $gcc -Parent
          "MINGW_BIN=$mingwBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $env:CGO_ENABLED = '1'
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          $env:CC = $gcc
          $env:CGO_LDFLAGS = '-static-libgcc'
          go build -trimpath -ldflags "-s -w -X main.version=$env:GITHUB_SHA" -o dist\FaceSign.exe ./cmd/facesign
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Bundle native runtime
        shell: pwsh
        run: |
          $ortZip = Join-Path $env:RUNNER_TEMP 'ort.zip'
          Invoke-WebRequest -Uri "https://github.com/microsoft/onnxruntime/releases/download/v$env:ORT_VERSION/onnxruntime-win-x64-$env:ORT_VERSION.zip" -OutFile $ortZip -UseBasicParsing
          $ortDir = Join-Path $env:RUNNER_TEMP 'ort'
          Expand-Archive -Path $ortZip -DestinationPath $ortDir -Force
          Copy-Item (Join-Path $ortDir "onnxruntime-win-x64-$env:ORT_VERSION\lib\onnxruntime.dll") dist\onnxruntime.dll -Force
          foreach ($dll in @('msvcp140.dll','msvcp140_1.dll','vcruntime140.dll','vcruntime140_1.dll')) {
            $source = Join-Path $env:WINDIR "System32\$dll"
            if (Test-Path $source) { Copy-Item $source (Join-Path 'dist' $dll) -Force }
          }
          $objdump = Join-Path $env:MINGW_BIN 'objdump.exe'
          $dependencyText = & $objdump -p dist\FaceSign.exe
          foreach ($dll in @('libgcc_s_seh-1.dll','libwinpthread-1.dll')) {
            if (($dependencyText -join "`n") -match [regex]::Escape($dll)) {
              Copy-Item (Join-Path $env:MINGW_BIN $dll) (Join-Path 'dist' $dll) -Force
            }
          }
          Copy-Item scripts\install.ps1 dist\scripts\install.ps1 -Force
          Copy-Item scripts\uninstall.ps1 dist\scripts\uninstall.ps1 -Force
          Copy-Item README.md dist\README.md -Force

      - name: Verify program package excludes models
        shell: pwsh
        run: |
          if (Test-Path 'dist\models') { throw 'Program package must not contain a models directory' }
          $onnxFiles = @(Get-ChildItem -Path dist -Filter '*.onnx' -File -Recurse -ErrorAction SilentlyContinue)
          if ($onnxFiles.Count -ne 0) { throw 'Program package unexpectedly contains ONNX model files' }
          $checksums = Get-Content 'models\SHA256SUMS'
          foreach ($line in $checksums) {
            if ($line -notmatch '^([0-9a-f]{64})\s+(.+)$') { throw "Invalid model checksum line: $line" }
            $expected = $matches[1].ToUpperInvariant()
            $path = Join-Path 'models' $matches[2]
            $actual = (Get-FileHash $path -Algorithm SHA256).Hash
            if ($actual -ne $expected) { throw "Model checksum mismatch: $path" }
          }

      - name: Smoke test recognition
        shell: pwsh
        run: |
          $db = Join-Path $env:RUNNER_TEMP 'facesign.db'
          $smokeAssets = Join-Path $env:RUNNER_TEMP 'facesign-smoke-assets'
          New-Item -ItemType Directory -Force -Path $smokeAssets | Out-Null
          Copy-Item 'dist\onnxruntime.dll' (Join-Path $smokeAssets 'onnxruntime.dll') -Force

          # Reproduce the real release layout: the program directory contains
          # no models. The executable must resolve models from an external
          # persistent cache instead of requiring models beside FaceSign.exe.
          $modelCache = Join-Path $env:RUNNER_TEMP 'facesign-model-cache'
          New-Item -ItemType Directory -Force -Path $modelCache | Out-Null
          Copy-Item 'models\face_detection_yunet_2023mar.onnx' (Join-Path $modelCache 'face_detection_yunet_2023mar.onnx') -Force
          Copy-Item 'models\face_recognition_sface_2021dec.onnx' (Join-Path $modelCache 'face_recognition_sface_2021dec.onnx') -Force
          Copy-Item 'models\anti-spoof-mn3.onnx' (Join-Path $modelCache 'anti-spoof-mn3.onnx') -Force

          $originalPath = $env:PATH
          $originalModelDir = $env:FACESIGN_MODEL_DIR
          $env:FACESIGN_MODEL_DIR = $modelCache
          $env:PATH = (Resolve-Path 'dist').Path + ';' + (Join-Path $env:WINDIR 'System32') + ';' + $env:WINDIR
          $process = Start-Process -FilePath (Resolve-Path 'dist\FaceSign.exe') -ArgumentList @('--listen','127.0.0.1:18082','--open-browser=false','--assets',$smokeAssets,'--data',$db,'--detection-threshold','0.60') -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:18082/api/health' -TimeoutSec 3
                if ($health.ok -and $health.device -eq 'cpu' -and -not $health.python -and -not $health.docker -and $health.liveness -match 'anti-spoof') { $ready = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw 'FaceSign health check failed' }
            if (Test-Path (Join-Path $smokeAssets 'models')) { throw 'Runtime unexpectedly required a models directory beside the executable' }
            $versionInfo = Invoke-RestMethod -Uri 'http://127.0.0.1:18082/api/version' -TimeoutSec 3
            if ($versionInfo.version -ne $env:GITHUB_SHA) { throw "Unexpected FaceSign version: $($versionInfo.version)" }
            $homeHeaders = Join-Path $env:RUNNER_TEMP 'home.headers'
            $homeBody = Join-Path $env:RUNNER_TEMP 'home.html'
            $homeStatus = & curl.exe -sS --max-redirs 0 -D $homeHeaders -o $homeBody -w "%{http_code}" 'http://127.0.0.1:18082/'
            if ($LASTEXITCODE -ne 0 -or $homeStatus -ne '200') { throw "FaceSign home page returned HTTP $homeStatus" }
            $homeHeaderText = Get-Content $homeHeaders -Raw
            if ($homeHeaderText -match '(?im)^Location:') { throw 'FaceSign home page unexpectedly redirects' }
            $homeContent = Get-Content $homeBody -Raw
            if ($homeContent -notmatch '<title>FaceSign</title>') { throw 'FaceSign home page content check failed' }
            $coreJs = Invoke-WebRequest -Uri 'http://127.0.0.1:18082/js/core.js' -UseBasicParsing -TimeoutSec 3
            $enrollmentJs = Invoke-WebRequest -Uri 'http://127.0.0.1:18082/js/enrollment.js' -UseBasicParsing -TimeoutSec 3
            $classesJs = Invoke-WebRequest -Uri 'http://127.0.0.1:18082/js/classes.js' -UseBasicParsing -TimeoutSec 3
            $photoImportJs = Invoke-WebRequest -Uri 'http://127.0.0.1:18082/js/photo_import.js' -UseBasicParsing -TimeoutSec 3
            $seatingJs = Invoke-WebRequest -Uri 'http://127.0.0.1:18082/js/seating.js' -UseBasicParsing -TimeoutSec 3
            if ($coreJs.StatusCode -ne 200 -or $enrollmentJs.Content -notmatch 'captureEnrollment' -or $classesJs.Content -notmatch 'loadClasses' -or $photoImportJs.Content -notmatch 'photoImportSessionID' -or $seatingJs.Content -notmatch 'loadCheckinSeatBoard') { throw 'FaceSign frontend module check failed' }

            $classOne = Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:18082/api/classes' -ContentType 'application/json' -Body '{"name":"Test","seat_rows":2,"seats_per_row":3}'
            $classTwo = Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:18082/api/classes' -ContentType 'application/json' -Body '{"name":"Backup","seat_rows":2,"seats_per_row":3}'
            Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:18082/api/classes/$($classTwo.id)/move" -ContentType 'application/json' -Body '{"direction":"up"}' | Out-Null
            $classes = Invoke-RestMethod -Uri 'http://127.0.0.1:18082/api/classes' -TimeoutSec 3
            if ($classes.Count -ne 2 -or $classes[0].name -ne 'Backup' -or $classes[1].name -ne 'Test') { throw 'Class ordering smoke test failed' }

            $photo = Join-Path $env:RUNNER_TEMP 'amy.jpg'
            Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/leandroveronezi/go-onnxface/main/examples/fotos/amy.jpg' -OutFile $photo -UseBasicParsing

            $checkRaw = & curl.exe -fsS -F "file=@$photo" 'http://127.0.0.1:18082/api/enrollment/check'
            if ($LASTEXITCODE -ne 0) { throw 'Enrollment duplicate pre-check failed' }
            $check = $checkRaw | ConvertFrom-Json
            if ($check.duplicate) { throw 'Fresh face was incorrectly reported as duplicate' }

            $createRaw = & curl.exe -fsS -F "file=@$photo" -F "student_no=SMOKE001" -F "name=Amy" -F "class_name=Test" -F "label=正面" 'http://127.0.0.1:18082/api/enrollment/create'
            if ($LASTEXITCODE -ne 0) { throw 'Face-first enrollment creation failed' }
            $create = $createRaw | ConvertFrom-Json
            $student = $create.student
            if ($student.student_no -ne 'SMOKE001' -or $student.face_count -ne 1 -or $student.class_name -ne 'Test') { throw 'Face-first enrollment returned unexpected student data' }
            $deleteUsedClassStatus = & curl.exe -sS -o NUL -w "%{http_code}" -X DELETE "http://127.0.0.1:18082/api/classes/$($classOne.id)"
            if ($deleteUsedClassStatus -ne '400') { throw "Used class deletion should be blocked with 400, got $deleteUsedClassStatus" }
            $renameClass = Invoke-RestMethod -Method Put -Uri "http://127.0.0.1:18082/api/classes/$($classOne.id)" -ContentType 'application/json' -Body '{"name":"Test-Renamed"}'
            if ($renameClass.name -ne 'Test-Renamed' -or $renameClass.student_count -ne 1) { throw 'Class rename smoke test failed' }
            $studentAfterRename = (Invoke-RestMethod -Uri 'http://127.0.0.1:18082/api/students' -TimeoutSec 3 | Where-Object { $_.student_no -eq 'SMOKE001' } | Select-Object -First 1)
            if (-not $studentAfterRename -or $studentAfterRename.class_name -ne 'Test-Renamed') { throw 'Class rename did not update student record' }

            $duplicateRaw = & curl.exe -fsS -F "file=@$photo" 'http://127.0.0.1:18082/api/enrollment/check'
            if ($LASTEXITCODE -ne 0) { throw 'Duplicate enrollment re-check failed' }
            $duplicate = $duplicateRaw | ConvertFrom-Json
            if (-not $duplicate.duplicate -or $duplicate.student.student_no -ne 'SMOKE001') { throw 'Duplicate face was not linked to the existing student' }

            $samples = Invoke-RestMethod -Uri "http://127.0.0.1:18082/api/students/$($student.id)/faces" -TimeoutSec 3
            if ($samples.Count -ne 1 -or $samples[0].label -ne '正面') { throw 'Initial face sample was not queryable' }

            $importPhoto = Join-Path $env:RUNNER_TEMP 'penny.jpg'
            Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/leandroveronezi/go-onnxface/main/examples/fotos/penny.jpg' -OutFile $importPhoto -UseBasicParsing
            $importDir = Join-Path $env:RUNNER_TEMP 'photo-import'
            New-Item -ItemType Directory -Force -Path $importDir | Out-Null
            Copy-Item $photo (Join-Path $importDir 'SMOKE001_Amy.jpg') -Force
            Copy-Item $importPhoto (Join-Path $importDir 'SMOKE002_Penny.jpg') -Force
            Set-Content -Path (Join-Path $importDir 'notes.txt') -Value 'ignored non-image'
            $importZip = Join-Path $env:RUNNER_TEMP 'photo-import.zip'
            Compress-Archive -Path (Join-Path $importDir '*') -DestinationPath $importZip -Force

            $analysisRaw = & curl.exe -fsS -F "file=@$importZip" 'http://127.0.0.1:18082/api/photo-import/analyze'
            if ($LASTEXITCODE -ne 0) { throw 'Photo ZIP analysis failed' }
            $analysis = $analysisRaw | ConvertFrom-Json
            if (-not $analysis.session_id -or $analysis.items.Count -ne 2) { throw 'Unexpected photo import analysis result' }
            $amyImport = $analysis.items | Where-Object { $_.student_no -eq 'SMOKE001' } | Select-Object -First 1
            $bernadetteImport = $analysis.items | Where-Object { $_.student_no -eq 'SMOKE002' } | Select-Object -First 1
            if (-not $amyImport -or $amyImport.status -ne 'existing') { throw 'Existing face was not detected during ZIP import' }
            if (-not $bernadetteImport -or $bernadetteImport.status -ne 'ready') { throw "New photo was not ready for import: $($bernadetteImport.status) $($bernadetteImport.reason)" }

            $commitBody = @{
              items = @(
                @{ id = $amyImport.id; action = 'skip'; student_no = 'SMOKE001'; name = 'Amy'; class_name = 'Test-Renamed' },
                @{ id = $bernadetteImport.id; action = 'new'; student_no = 'SMOKE002'; name = 'Penny'; class_name = 'Test-Renamed' }
              )
            } | ConvertTo-Json -Depth 6
            $commitResult = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:18082/api/photo-import/$($analysis.session_id)/commit" -ContentType 'application/json' -Body $commitBody
            if ($commitResult.imported -ne 1 -or $commitResult.failed -ne 0) { throw 'Photo ZIP commit failed' }

            $studentsAfterImport = Invoke-RestMethod -Uri 'http://127.0.0.1:18082/api/students' -TimeoutSec 3
            $importedStudent = $studentsAfterImport | Where-Object { $_.student_no -eq 'SMOKE002' } | Select-Object -First 1
            if (-not $importedStudent -or $importedStudent.face_count -ne 1 -or $importedStudent.class_name -ne 'Test-Renamed') { throw 'Imported student data is incorrect' }

            Invoke-RestMethod -Method Put -Uri "http://127.0.0.1:18082/api/students/$($importedStudent.id)" -ContentType 'application/json' -Body '{"class_name":"Backup"}' | Out-Null
            $studentsAfterEdit = Invoke-RestMethod -Uri 'http://127.0.0.1:18082/api/students' -TimeoutSec 3
            $editedStudent = $studentsAfterEdit | Where-Object { $_.student_no -eq 'SMOKE002' } | Select-Object -First 1
            if (-not $editedStudent -or $editedStudent.class_name -ne 'Backup') { throw 'Imported student class edit failed' }

            $importRecognizeRaw = & curl.exe -fsS -H 'X-FaceSign-Session: smoke-import' -F "file=@$importPhoto" 'http://127.0.0.1:18082/api/recognize'
            if ($LASTEXITCODE -ne 0) { throw 'Imported photo recognition failed' }
            $importRecognize = $importRecognizeRaw | ConvertFrom-Json
            if (-not $importRecognize.matched -or $importRecognize.student.student_no -ne 'SMOKE002') { throw 'Imported face sample identity did not match correctly' }
            if ($importRecognize.recognized) { throw 'Single recognition frame must not bypass multi-frame liveness voting' }
            if (-not $importRecognize.liveness_status) { throw 'Passive liveness status was not returned' }
            Write-Host "Passive liveness score (import smoke): $($importRecognize.liveness_score) status=$($importRecognize.liveness_status)"

            $sameSampleStatus = & curl.exe -sS -o NUL -w "%{http_code}" -F "file=@$photo" -F "label=左侧" "http://127.0.0.1:18082/api/students/$($student.id)/faces"
            if ($sameSampleStatus -ne '409') { throw "Near-identical supplemental sample should be rejected with 409, got $sameSampleStatus" }

            $recognizeRaw = & curl.exe -fsS -H 'X-FaceSign-Session: smoke-amy' -F "file=@$photo" 'http://127.0.0.1:18082/api/recognize'
            if ($LASTEXITCODE -ne 0) { throw 'Recognition smoke test failed' }
            $recognize = $recognizeRaw | ConvertFrom-Json
            if (-not $recognize.matched -or $recognize.student.student_no -ne 'SMOKE001') { throw 'Recognition identity did not match enrolled student' }
            if ($recognize.recognized) { throw 'One frame unexpectedly created an attendance decision' }
            if ($recognize.liveness_frames -ne 1) { throw "Expected first liveness frame, got $($recognize.liveness_frames)" }

            Invoke-RestMethod -Method Put -Uri "http://127.0.0.1:18082/api/students/$($student.id)" -ContentType 'application/json' -Body '{"seat_no":1}' | Out-Null
            $absentStudent = Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:18082/api/students' -ContentType 'application/json' -Body '{"student_no":"SMOKE003","name":"Absent","class_name":"Test-Renamed"}'
            Invoke-RestMethod -Method Put -Uri "http://127.0.0.1:18082/api/students/$($absentStudent.id)" -ContentType 'application/json' -Body '{"seat_no":2}' | Out-Null
            $today = Get-Date -Format 'yyyy-MM-dd'
            $seatBoard = Invoke-RestMethod -Uri "http://127.0.0.1:18082/api/attendance/seats?day=$today&class_name=Test-Renamed" -TimeoutSec 3
            if ($seatBoard.total -ne 2 -or $seatBoard.signed -ne 0 -or $seatBoard.unsigned -ne 2) { throw 'Single-frame recognition must not mark attendance before liveness vote' }
            if ($seatBoard.class.seat_rows -ne 2 -or $seatBoard.class.seats_per_row -ne 3) { throw 'Seat layout smoke test failed' }

            $unknownPhoto = Join-Path $env:RUNNER_TEMP 'howard.jpg'
            Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/leandroveronezi/go-onnxface/main/examples/fotos/howard.jpg' -OutFile $unknownPhoto -UseBasicParsing
            $groupPhoto = Join-Path $env:RUNNER_TEMP 'group.jpg'
            Add-Type -AssemblyName System.Drawing
            $knownImage = [System.Drawing.Image]::FromFile($photo)
            $unknownImage = [System.Drawing.Image]::FromFile($unknownPhoto)
            $groupBitmap = New-Object System.Drawing.Bitmap 900,450
            $graphics = [System.Drawing.Graphics]::FromImage($groupBitmap)
            try {
              $graphics.Clear([System.Drawing.Color]::White)
              $graphics.DrawImage($knownImage, 0, 0, 450, 450)
              $graphics.DrawImage($unknownImage, 450, 0, 450, 450)
              $groupBitmap.Save($groupPhoto, [System.Drawing.Imaging.ImageFormat]::Jpeg)
            } finally {
              $graphics.Dispose()
              $groupBitmap.Dispose()
              $knownImage.Dispose()
              $unknownImage.Dispose()
            }

            $groupEnrollStatus = & curl.exe -sS -o NUL -w "%{http_code}" -F "file=@$groupPhoto" "http://127.0.0.1:18082/api/students/$($student.id)/face"
            if ($groupEnrollStatus -ne '422') { throw "Multi-face enrollment should be rejected with 422, got $groupEnrollStatus" }

            $groupRecognizeRaw = & curl.exe -fsS -H 'X-FaceSign-Session: smoke-group' -F "file=@$groupPhoto" 'http://127.0.0.1:18082/api/recognize'
            if ($LASTEXITCODE -ne 0) { throw 'Multi-face recognition smoke test failed' }
            $groupRecognize = $groupRecognizeRaw | ConvertFrom-Json
            if ($groupRecognize.detected_count -lt 2) { throw "Expected at least 2 detected faces, got $($groupRecognize.detected_count)" }
            if ($groupRecognize.matched_count -lt 1) { throw 'Expected at least one enrolled identity match in group recognition' }
            if ($groupRecognize.unregistered_count -lt 1) { throw 'Expected at least one unregistered face in group recognition' }
            $knownResult = $groupRecognize.faces | Where-Object { $_.matched -and $_.student.student_no -eq 'SMOKE001' } | Select-Object -First 1
            if (-not $knownResult -or -not $knownResult.liveness_status) { throw 'Enrolled student was not tracked with liveness in group recognition' }
            $unknownResult = $groupRecognize.faces | Where-Object { -not $_.matched -and $_.status -eq '未录入' } | Select-Object -First 1
            if (-not $unknownResult) { throw 'Unregistered face was not reported as 未录入' }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            $env:PATH = $originalPath
            $env:FACESIGN_MODEL_DIR = $originalModelDir
          }

      - name: Upload Windows release
        uses: actions/upload-artifact@v7
        with:
          name: facesign-windows-amd64
          path: dist/
          if-no-files-found: error
          retention-days: 30

  cleanup-old-runs:
    needs: build-windows
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Keep current and previous successful run
        uses: actions/github-script@v9
        env:
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentRun = context.runId;
            const workflowPath = process.env.GITHUB_WORKFLOW_REF.split('@')[0];
            const workflowFile = workflowPath.substring(workflowPath.lastIndexOf('/') + 1);
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: workflowFile, per_page: 100,
            });
            const keep = new Set([currentRun]);
            const previousSuccess = runs
              .filter(run => run.id !== currentRun && run.status === 'completed' && run.conclusion === 'success')
              .sort((a,b) => new Date(b.created_at) - new Date(a.created_at))[0];
            if (previousSuccess) keep.add(previousSuccess.id);
            for (const run of runs) {
              if (run.status !== 'completed' || keep.has(run.id)) continue;
              try {
                await github.rest.actions.deleteWorkflowRun({owner, repo, run_id: run.id});
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
