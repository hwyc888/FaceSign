name: Build FaceSign Servers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true
          cache-dependency-path: go.sum

      - name: Verify module files are tidy
        shell: bash
        run: |
          set -euo pipefail
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Validate deployment scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/linux/install.sh
          bash -n deploy/face-engine/install-compreface.sh

      - name: Validate PowerShell deployment scripts
        shell: pwsh
        run: |
          $failed = $false
          foreach ($path in @('deploy/windows/install-service.ps1', 'deploy/windows/uninstall-service.ps1', 'deploy/face-engine/install-compreface.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$path`: $_" }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Build platform release packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/linux/face-engine dist/windows/face-engine

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/linux/facesign ./cmd/facesign
          install -m 0755 deploy/linux/install.sh dist/linux/install.sh
          install -m 0644 deploy/linux/facesign.service dist/linux/facesign.service
          install -m 0755 deploy/face-engine/install-compreface.sh dist/linux/face-engine/install-compreface.sh
          install -m 0644 deploy/linux/README.txt dist/linux/README.txt
          install -m 0644 config.example.env dist/linux/config.example.env

          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/windows/facesign.exe ./cmd/facesign
          cp deploy/windows/install-service.ps1 deploy/windows/uninstall-service.ps1 dist/windows/
          cp deploy/face-engine/install-compreface.ps1 dist/windows/face-engine/
          cp deploy/windows/README.txt config.example.env dist/windows/

          tar -czf dist/facesign-linux-amd64.tar.gz -C dist/linux .
          (cd dist/windows && zip -qr ../facesign-windows-amd64.zip .)

      - name: Verify release package contents
        shell: bash
        run: |
          set -euo pipefail
          linux_files="$(tar -tzf dist/facesign-linux-amd64.tar.gz)"
          windows_files="$(unzip -Z1 dist/facesign-windows-amd64.zip)"
          for path in ./facesign ./install.sh ./facesign.service ./face-engine/install-compreface.sh ./README.txt; do
            grep -Fxq "$path" <<<"$linux_files"
          done
          for path in facesign.exe install-service.ps1 uninstall-service.ps1 face-engine/install-compreface.ps1 README.txt; do
            grep -Fxq "$path" <<<"$windows_files"
          done
          test -x dist/linux/facesign
          file dist/windows/facesign.exe | grep -q 'PE32+'

      - name: Upload Linux release package
        uses: actions/upload-artifact@v7
        with:
          name: facesign-linux-amd64
          path: dist/facesign-linux-amd64.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows release package
        uses: actions/upload-artifact@v7
        with:
          name: facesign-windows-amd64
          path: dist/facesign-windows-amd64.zip
          if-no-files-found: error
          retention-days: 30

  cleanup-old-runs:
    needs: build
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Keep only current and previous successful build run
        uses: actions/github-script@v9
        env:
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentRun = context.runId;
            const workflowPath = process.env.GITHUB_WORKFLOW_REF.split('@')[0];
            const workflowFile = workflowPath.substring(workflowPath.lastIndexOf('/') + 1);
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner,
              repo,
              workflow_id: workflowFile,
              per_page: 100,
            });

            const keep = new Set([currentRun]);
            const previousSuccess = runs
              .filter(run => run.id !== currentRun && run.status === 'completed' && run.conclusion === 'success')
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];
            if (previousSuccess) keep.add(previousSuccess.id);

            for (const run of runs) {
              if (run.status !== 'completed' || keep.has(run.id)) continue;
              try {
                await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: run.id });
                core.info(`Deleted old completed run ${run.id} (${run.conclusion})`);
              } catch (error) {
                if (error.status === 404) {
                  core.info(`Run ${run.id} was already deleted`);
                  continue;
                }
                throw error;
              }
            }
