name: Build FaceSign Servers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true
          cache-dependency-path: go.sum

      - name: Verify module files are tidy
        shell: bash
        run: |
          set -euo pipefail
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Validate local CPU face engine scripts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile deploy/face-engine/face_engine.py
          bash -n deploy/face-engine/install-localcpu.sh

      - name: Validate Windows face engine installer
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'deploy/face-engine/install-localcpu.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'deploy/face-engine/uninstall-localcpu.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }

      - name: Build Linux and Windows servers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/facesign-linux-amd64 ./cmd/facesign
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/facesign-windows-amd64.exe ./cmd/facesign
          cp config.example.env dist/config.example.env
          cp -R deploy/face-engine dist/face-engine

      - name: Upload server binaries
        uses: actions/upload-artifact@v7
        with:
          name: facesign-server-amd64
          path: dist/
          if-no-files-found: error
          retention-days: 30

  cleanup-old-runs:
    needs: build
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Keep only current and previous successful build run
        uses: actions/github-script@v9
        env:
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentRun = context.runId;
            const workflowPath = process.env.GITHUB_WORKFLOW_REF.split('@')[0];
            const workflowFile = workflowPath.substring(workflowPath.lastIndexOf('/') + 1);
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner,
              repo,
              workflow_id: workflowFile,
              per_page: 100,
            });

            const keep = new Set([currentRun]);
            const previousSuccess = runs
              .filter(run => run.id !== currentRun && run.status === 'completed' && run.conclusion === 'success')
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];
            if (previousSuccess) keep.add(previousSuccess.id);

            for (const run of runs) {
              if (run.status !== 'completed' || keep.has(run.id)) continue;
              try {
                await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: run.id });
                core.info(`Deleted old completed run ${run.id} (${run.conclusion})`);
              } catch (error) {
                if (error.status === 404) {
                  core.info(`Run ${run.id} was already deleted`);
                  continue;
                }
                throw error;
              }
            }
