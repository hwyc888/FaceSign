name: Build FaceSign Servers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: false

      - name: Resolve module checksums
        shell: bash
        run: |
          set -euo pipefail
          go mod tidy
          echo '---BEGIN GO.SUM---'
          cat go.sum
          echo '---END GO.SUM---'

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build Linux and Windows servers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/facesign-linux-amd64 ./cmd/facesign
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/facesign-windows-amd64.exe ./cmd/facesign
          cp config.example.env dist/config.example.env

      - name: Upload server binaries
        uses: actions/upload-artifact@v4
        with:
          name: facesign-server-amd64
          path: dist/
          if-no-files-found: error

  cleanup-old-runs:
    needs: build
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Keep only current and previous successful build run
        uses: actions/github-script@v7
        env:
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentRun = context.runId;
            const workflowPath = process.env.GITHUB_WORKFLOW_REF.split('@')[0];
            const workflowFile = workflowPath.substring(workflowPath.lastIndexOf('/') + 1);
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner,
              repo,
              workflow_id: workflowFile,
              per_page: 100,
            });

            const keep = new Set([currentRun]);
            const previousSuccess = runs
              .filter(run => run.id !== currentRun && run.status === 'completed' && run.conclusion === 'success')
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];
            if (previousSuccess) keep.add(previousSuccess.id);

            for (const run of runs) {
              if (run.status !== 'completed' || keep.has(run.id)) continue;
              try {
                await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: run.id });
                core.info(`Deleted old completed run ${run.id} (${run.conclusion})`);
              } catch (error) {
                if (error.status === 404) {
                  core.info(`Run ${run.id} was already deleted`);
                  continue;
                }
                throw error;
              }
            }
